<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffe76a">
  <meta name="description" content="咔嗒！点亮方格，和四个黏土乐手一起做一段节拍。">
  <title>咔嗒！· 节拍游乐场</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='2' y='2' width='36' height='36' rx='9' fill='%23ff654e' stroke='%23231b25' stroke-width='3'/%3E%3Cpath d='M22 6 10 23h9l-1 11 12-17h-9Z' fill='%23fff09b' stroke='%23231b25' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --ink: #241c25;
      --lemon: #ffe76a;
      --cream: #fff2bf;
      --red: #ff6651;
      --pink: #ffabd0;
      --plum: #332838;
      --lime: #e0ff79;
      --label: "Arcade Numbers", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --title: "Arcade Han", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --heavy: "Arcade Display", "Arial Black", system-ui, sans-serif;
      --gutter: clamp(17px, 5.35vw, 110px);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    *, *::after, *::before { box-sizing: border-box; }
    body { margin: 0; background: var(--lemon); color: var(--ink); }
    h1, h2, p { margin: 0; }
    button, input { font: inherit; }
    button { cursor: pointer; color: inherit; }
    button:disabled { cursor: default; }
    button, input { -webkit-tap-highlight-color: transparent; }
    ::selection { background: #d0aaff; color: var(--ink); }
    :focus-visible { outline: 3px solid #5b37c5; outline-offset: 4px; }
    .console :focus-visible { outline-color: #fff2a5; outline-offset: 3px; }
    .shell { width: min(calc(100% - 2 * var(--gutter)), 1300px); margin-inline: auto; }
    .icons { position: absolute; width: 0; height: 0; overflow: hidden; }
    .icon { width: 18px; height: 18px; flex: none; vertical-align: middle; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .mastbar {
      min-height: 63px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      border-bottom: 2px solid var(--ink);
    }
    .wordmark {
      display: flex;
      align-items: center;
      gap: 9px;
      font: 400 clamp(14px, 1.55vw, 21px)/1 var(--heavy);
      white-space: nowrap;
      letter-spacing: -.045em;
    }
    .wordmark .mark {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: 2px solid var(--ink);
      background: var(--red);
      transform: rotate(-8deg);
      box-shadow: 2px 2px var(--ink);
    }
    .wordmark .icon { width: 19px; height: 19px; }
    .mast-tools { display: flex; align-items: center; gap: 8px; }
    .utility {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 38px;
      padding: 0 11px;
      border: 1.5px solid var(--ink);
      border-radius: 7px;
      background: var(--cream);
      color: var(--ink);
      font-size: 12px;
      font-weight: 720;
      white-space: nowrap;
      transition: box-shadow 130ms, transform 130ms, background-color 130ms;
    }
    .utility:hover { transform: translate(-1px, -1px); box-shadow: 2px 2px var(--ink); }
    .utility:active { transform: translate(1px, 1px); box-shadow: none; }
    .utility .icon { width: 16px; height: 16px; }
    .utility[aria-pressed="true"] { background: #d9bcff; }
    .mute-off, #mute[aria-pressed="true"] .mute-on { display: none; }
    #mute[aria-pressed="true"] .mute-off { display: inline; }

    .headline {
      position: relative;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      min-height: 156px;
      gap: 25px;
      padding-block: 11px clamp(18px, 2.8vh, 27px);
    }
    .headline h1 {
      display: flex;
      align-items: baseline;
      column-gap: .045em;
      width: fit-content;
      margin-left: -.065em;
      font: 900 clamp(91px, 10.15vw, 155px)/.96 var(--title);
      letter-spacing: -.096em;
      white-space: nowrap;
    }
    .headline h1 span { display: inline-block; }
    .headline h1 span:nth-child(2) {
      color: var(--red);
      -webkit-text-stroke: .018em var(--ink);
      paint-order: stroke fill;
      transform-origin: bottom;
      transform: rotate(-5.5deg) translateY(.017em);
      text-shadow: .028em .034em var(--ink);
    }
    .bang {
      color: #b49aff;
      font: 400 .89em/.85 var(--heavy);
      -webkit-text-stroke: .020em var(--ink);
      paint-order: stroke fill;
      text-shadow: .04em .036em var(--ink);
      transform: rotate(9deg) translateY(.026em);
      margin-left: .055em;
    }
    .pitch {
      position: relative;
      min-width: 294px;
      padding: 0 22px 4px 26px;
      border-left: 2px solid var(--ink);
    }
    .pitch h2 {
      margin-bottom: 7px;
      font-size: clamp(21px, 2.15vw, 32px);
      font-weight: 900;
      letter-spacing: -.015em;
    }
    .pitch p { font-size: clamp(12px, 1.17vw, 16px); font-weight: 540; line-height: 1.7; }
    .pitch-star {
      position: absolute;
      width: clamp(30px, 5.2vw, 75px);
      height: auto;
      top: 16%;
      right: 37%;
      color: #6b49cd;
      transform: rotate(13deg);
      pointer-events: none;
    }

    .machine {
      --tone-kick: #ff8065;
      --tone-snare: #c5b0ff;
      --tone-hat: #e0fa7d;
      --tone-bass: #80b9ff;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border: 3px solid var(--ink);
      border-radius: 18px;
      background: var(--ink);
      box-shadow: 7px 8px var(--ink);
    }
    [data-track="0"] { --tone: var(--tone-kick); --foil: #c4a7fb; }
    [data-track="1"] { --tone: var(--tone-snare); --foil: #fff19b; }
    [data-track="2"] { --tone: var(--tone-hat); --foil: #f9e2ec; }
    [data-track="3"] { --tone: var(--tone-bass); --foil: #ffa476; }

    .stage {
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-rows: minmax(0, 1fr);
      align-items: stretch;
      height: clamp(182px, 18.7vw, 267px);
      padding: 0 clamp(4px, 4.5vw, 70px);
      overflow: hidden;
      border-bottom: 3px solid var(--ink);
      background:
        radial-gradient(ellipse at 50% 7%, #ffd1e4 3%, transparent 57%),
        linear-gradient(115deg, #ff99bb, #ffb7d6 52%, #ff9dc3);
    }
    .stage::before {
      position: absolute;
      inset: 0;
      z-index: -2;
      content: "";
      pointer-events: none;
      background:
        radial-gradient(circle at center, #6a3160 0 1px, transparent 1.45px) 0 0 / 9px 9px,
        repeating-linear-gradient(123deg, transparent 0 150px, #fff5ea98 151px 153px, transparent 154px 195px);
      opacity: .28;
      mask-image: linear-gradient(90deg, black, transparent 31%, transparent 61%, black);
    }
    .checker-floor {
      position: absolute;
      z-index: -1;
      inset: auto -10% -35% -10%;
      height: 66%;
      pointer-events: none;
      background: repeating-conic-gradient(#d975ac 0% 25%, #ffbcda 0% 50%) 50% 50% / 48px 48px;
      transform-origin: top;
      transform: perspective(600px) rotateX(54deg);
      opacity: .55;
      mask-image: linear-gradient(transparent, black 29%);
    }
    .performer {
      --mood-tilt: -5deg;
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      align-items: end;
      justify-items: center;
      gap: 6px;
      min-width: 0;
      min-height: 0;
      padding: 23px 0 12px;
      border: 0;
      outline-offset: -4px;
      border-radius: 8px;
      background: none;
    }
    .performer[data-track="1"] { --mood-tilt: 4deg; }
    .performer[data-track="2"] { --mood-tilt: -4deg; }
    .performer[data-track="3"] { --mood-tilt: 5.5deg; }
    .foil, .floor-shadow, .burst {
      position: absolute;
      pointer-events: none;
    }
    .foil {
      z-index: -1;
      width: min(98%, 211px);
      height: 72%;
      top: 11%;
      left: 50%;
      translate: -50% 0;
      background: var(--foil);
      rotate: var(--mood-tilt);
      clip-path: polygon(12% 14%, 83% 4%, 100% 32%, 93% 82%, 77% 99%, 8% 85%, 0% 37%);
      transition: rotate 240ms cubic-bezier(.15,.7,.22,1), scale 240ms cubic-bezier(.15,.7,.22,1);
    }
    .performer[data-track="1"] .foil { clip-path: polygon(0 33%, 45% 0, 93% 12%, 100% 68%, 63% 100%, 13% 83%); }
    .performer[data-track="2"] .foil { clip-path: polygon(50% 0, 63% 15%, 86% 6%, 86% 27%, 100% 42%, 87% 59%, 95% 84%, 72% 83%, 56% 100%, 38% 86%, 12% 94%, 15% 68%, 0 47%, 19% 29%, 20% 10%, 36% 19%); }
    .performer[data-track="3"] .foil { clip-path: polygon(7% 11%, 82% 2%, 100% 26%, 95% 82%, 67% 100%, 5% 85%, 0 39%); }
    .performer:hover .foil { scale: 1.07; rotate: 0deg; }
    .floor-shadow {
      bottom: 44px;
      left: 50%;
      width: 58%;
      max-width: 132px;
      height: 13px;
      border-radius: 50%;
      background: #3f22535e;
      translate: -50% 0;
      filter: blur(4px);
    }
    .burst {
      z-index: 2;
      top: 14%;
      left: 72%;
      width: 27px;
      height: 35px;
      background: var(--cream);
      opacity: 0;
      transform-origin: 50% 85%;
      clip-path: polygon(50% 0, 63% 32%, 91% 19%, 78% 46%, 100% 55%, 75% 66%, 83% 96%, 57% 84%, 46% 100%, 34% 78%, 8% 90%, 16% 63%, 0 40%, 30% 40%);
    }
    .art-rig {
      display: grid;
      grid-template: minmax(0, 1fr) / minmax(0, 1fr);
      place-items: stretch;
      width: 91%;
      max-width: 246px;
      height: 100%;
      min-height: 0;
      transform-origin: 50% 93%;
      pointer-events: none;
    }
    .actor {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 0;
      max-height: 204px;
      object-fit: contain;
      object-position: bottom;
      filter: drop-shadow(4px 5px 3px #512a6545);
      user-select: none;
      -webkit-user-drag: none;
      translate: 0 0;
      transition: translate 150ms cubic-bezier(.18,.77,.28,1);
    }
    .performer:hover .actor { translate: 0 -4px; }
    .performer:active .actor { translate: 0 1px; }
    .performer-caption {
      z-index: 2;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: clamp(3px, .65vw, 9px);
      min-height: 30px;
      padding: 2px clamp(5px, 1.1vw, 14px);
      border: 1.5px solid var(--ink);
      border-radius: 6px;
      background: var(--cream);
      box-shadow: 2px 2px var(--ink);
      white-space: nowrap;
      font-size: clamp(11px, 1.07vw, 15px);
      font-weight: 800;
      transition: background-color 130ms, box-shadow 130ms;
    }
    .performer-caption kbd {
      display: grid;
      place-items: center;
      width: 19px;
      height: 20px;
      border-radius: 4px;
      background: var(--tone);
      font: 700 13px/1 var(--label);
    }
    .performer:hover .performer-caption, .performer.is-hit .performer-caption { background: var(--tone); }
    .stage-cross {
      position: absolute;
      width: 26px;
      height: 26px;
      color: #38214b;
      pointer-events: none;
      opacity: .75;
    }
    .stage-cross.first { left: 2.1%; top: 12%; rotate: -9deg; }
    .stage-cross.last { right: 2.6%; bottom: 19%; rotate: 9deg; width: 21px; height: 21px; }

    .console {
      --matrix: 66px repeat(16, minmax(0, 1fr));
      --pad-gap: clamp(3px, .58vw, 8px);
      padding: 14px clamp(12px, 2.1vw, 29px) 14px;
      background: linear-gradient(155deg, #372b3a, #2a2230 76%);
      color: #fff4d0;
    }
    .console-top {
      display: flex;
      align-items: center;
      gap: clamp(12px, 2.7vw, 38px);
      min-height: 47px;
    }
    .play-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex: none;
      min-height: 43px;
      min-width: 118px;
      padding: 0 13px;
      border: 1.5px solid #fff0cb;
      border-radius: 7px;
      background: var(--lime);
      color: var(--ink);
      box-shadow: 0 3px #131016;
      font-size: 14px;
      font-weight: 840;
      transition: background-color 130ms, transform 130ms;
    }
    .play-toggle:hover { background: #efffae; }
    .play-toggle:active { transform: translateY(2px); }
    .play-toggle[aria-pressed="true"] { background: #ffb0ce; }
    .play-toggle .icon { width: 17px; height: 17px; }
    .play-toggle .stop, .play-toggle[aria-pressed="true"] .go { display: none; }
    .play-toggle[aria-pressed="true"] .stop { display: inline; }
    .tempo {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 9px;
      color: #f4e6ee;
      min-width: 158px;
      width: min(250px, 24%);
    }
    .tempo-value {
      color: #fff4d0;
      font: 700 17px/1 var(--label);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .tempo-value small { color: #ded0d9; font: 600 10px/1 var(--label); letter-spacing: .065em; }
    .tempo input {
      --level: 44%;
      width: 100%;
      min-width: 50px;
      height: 30px;
      padding: 0;
      margin: 0;
      appearance: none;
      cursor: ew-resize;
      background: transparent;
    }
    .tempo input::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 3px;
      background: linear-gradient(90deg, #eac7ff var(--level), #74647b var(--level));
    }
    .tempo input::-moz-range-track {
      height: 4px;
      border-radius: 3px;
      background: linear-gradient(90deg, #eac7ff var(--level), #74647b var(--level));
    }
    .tempo input::-webkit-slider-thumb {
      width: 15px;
      height: 15px;
      margin-top: -5.5px;
      appearance: none;
      border: 1px solid #2e2039;
      border-radius: 4px;
      background: #d6a8fb;
      box-shadow: 0 0 0 1px #d6a8fb;
    }
    .tempo input::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border: 1px solid #2e2039;
      border-radius: 4px;
      background: #d6a8fb;
      box-shadow: 0 0 0 1px #d6a8fb;
    }
    .presets {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      margin-left: auto;
    }
    .preset-label { color: #dfcfdc; margin-right: 4px; font-size: 11px; white-space: nowrap; }
    .preset {
      min-height: 34px;
      min-width: 58px;
      padding: 0 11px;
      border: 1px solid #9a839b;
      border-radius: 6px;
      background: #302437;
      color: #fff1e1;
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
      transition: background-color 150ms, color 150ms, border-color 150ms;
    }
    .preset:hover { border-color: #ffeacb; background: #513b58; }
    .preset[aria-pressed="true"] { border-color: #f3b9f7; background: #efc6f7; color: #27172d; }

    .sheet-nav { display: none; }
    .matrix {
      display: grid;
      gap: 7px;
      margin-block: 10px 14px;
    }
    .lane, .meter-row { display: grid; grid-template-columns: var(--matrix); gap: var(--pad-gap); align-items: center; }
    .lane-name {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #f9e8f1;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 700;
    }
    .lane-name::before {
      display: block;
      width: 7px;
      height: 7px;
      flex: none;
      border-radius: 2px;
      background: var(--tone);
      content: "";
    }
    .meter-row { height: 17px; }
    .beat-mark {
      display: flex;
      align-items: center;
      height: 15px;
      gap: 6px;
      color: #e8d5e7;
      font: 700 11px/1 var(--label);
    }
    .beat-mark::after { content: ""; flex: 1; height: 1px; background: #b28caf56; }
    .beat-mark:nth-of-type(2) { grid-column: 2 / span 4; }
    .beat-mark:nth-of-type(3) { grid-column: 6 / span 4; }
    .beat-mark:nth-of-type(4) { grid-column: 10 / span 4; }
    .beat-mark:nth-of-type(5) { grid-column: 14 / span 4; }
    .pad {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      min-height: clamp(34px, 3.16vw, 45px);
      border: 1px solid #8e7891;
      border-radius: 6px;
      padding: 0;
      background: linear-gradient(180deg, #4c3d50, #433447);
      color: #a996ae;
      box-shadow: 0 2px #211925, inset 0 -3px #2f23337d;
      touch-action: none;
      user-select: none;
      transition: background-color 120ms, border-color 120ms, transform 100ms, box-shadow 120ms;
    }
    .pad::after {
      display: block;
      width: 5px;
      height: 5px;
      border: 1px solid currentColor;
      border-radius: 50%;
      content: "";
      opacity: .8;
    }
    .pad.is-beat::after {
      width: 7px;
      height: 7px;
      border-radius: 2px;
      rotate: 45deg;
    }
    .pad:hover { border-color: #f3c9f4; }
    .pad:active { transform: translateY(2px); }
    .pad[aria-pressed="true"] {
      background: var(--tone);
      border-color: var(--tone);
      color: #382132;
      box-shadow: 0 2px #201725, inset 0 -3px #53264732;
    }
    .pad[aria-pressed="true"]::after { background: currentColor; }
    .pad.is-current {
      border-color: #fff8d6;
      box-shadow: 0 0 0 1px #fff8d6, 0 0 10px #f7dafa50, inset 0 -3px #37233128;
    }
    .pad.is-current[aria-pressed="true"] { background: #fff6d7; }
    .beat-mark.is-playing { color: #f8d5ff; }

    .bottom-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .edit-tools { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
    .deck-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 34px;
      padding: 0 10px;
      border: 1px solid #8b748c;
      border-radius: 6px;
      background: #302538;
      color: #f7edf3;
      font-size: 11px;
      font-weight: 680;
      white-space: nowrap;
      transition: background-color 150ms, border-color 150ms;
    }
    .deck-button:not(:disabled):hover { background: #514059; border-color: #efcaef; }
    .deck-button:disabled { opacity: .5; }
    .deck-button .icon { width: 15px; height: 15px; }
    .deck-button.export { background: #fff1c7; border-color: #fff1c7; color: var(--ink); }
    .deck-button.export:not(:disabled):hover { background: #faacd8; border-color: #faacd8; }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding-block: 22px 17px;
      color: #493840;
      font-size: 11px;
      line-height: 1.5;
    }
    .footer kbd {
      color: var(--ink);
      font: 700 12px/1 var(--label);
    }
    .footer strong { color: var(--ink); font-weight: 750; }
    .notify {
      position: fixed;
      right: max(17px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 5;
      max-width: min(calc(100vw - 34px), 38ch);
      padding: 12px 14px;
      border: 2px solid var(--ink);
      border-radius: 8px;
      background: var(--pink);
      box-shadow: 3px 3px var(--ink);
      font-size: 13px;
      font-weight: 680;
    }
    .notify:empty { display: none; }

    dialog {
      max-width: min(480px, calc(100vw - 38px));
      padding: 24px;
      border: 3px solid var(--ink);
      border-radius: 14px;
      background: var(--cream);
      color: var(--ink);
      box-shadow: 7px 7px var(--ink);
    }
    dialog::backdrop { background: #25172bad; }
    .help-heading { display: flex; align-items: center; justify-content: space-between; gap: 30px; }
    .help-heading h2 { font-size: 25px; font-weight: 900; }
    .help-heading .utility { width: 39px; padding: 0; background: #ffd0e5; }
    .key-list { display: grid; grid-template-columns: auto 1fr; gap: 12px 22px; margin-bottom: 0; align-items: center; }
    .key-list dd { margin: 0; font-size: 13px; }
    .key-list kbd { font: 700 14px/1 var(--label); border: 1px solid var(--ink); border-radius: 4px; padding: 3px 5px; background: #efe2ff; white-space: nowrap; }
    .nojs { margin: 12px 0; color: var(--cream); font-size: 13px; }

    @media (max-width: 970px) {
      :root { --gutter: clamp(17px, 4vw, 43px); }
      .headline { min-height: 139px; }
      .headline h1 { font-size: clamp(80px, 12vw, 112px); }
      .pitch { min-width: 265px; padding-right: 10px; }
      .pitch-star { right: 40%; }
      .console { --matrix: 56px repeat(16, minmax(0, 1fr)); }
    }
    @media (max-width: 700px) {
      .mastbar { min-height: 55px; gap: 9px; }
      .wordmark { gap: 7px; font-size: 15px; }
      .wordmark .mark { width: 25px; height: 25px; border-radius: 6px; }
      .wordmark .icon { width: 17px; height: 17px; }
      .mast-tools { gap: 5px; }
      .mast-tools .utility { min-height: 38px; min-width: 39px; padding: 0 7px; gap: 4px; font-size: 11px; }
      .headline { min-height: 122px; gap: 11px; padding-block: 12px 17px; }
      .headline h1 { font-size: clamp(66px, 14.2vw, 99px); }
      .pitch { padding: 0 0 0 10px; min-width: 0; border-left-width: 1.5px; }
      .pitch h2 { font-size: clamp(14px, 3.9vw, 23px); margin-bottom: 3px; }
      .pitch p { font-size: 11px; line-height: 1.55; }
      .pitch p span { display: block; }
      .pitch-star { display: none; }
      .machine { border-width: 2px; border-radius: 12px; box-shadow: 4px 5px var(--ink); }
      .stage { height: clamp(141px, 33.5vw, 225px); padding-inline: 3px; border-bottom-width: 2px; }
      .stage-cross { display: none; }
      .checker-floor { background-size: 30px 30px; }
      .performer { padding-block: 14px 9px; gap: 4px; }
      .performer-caption { border-radius: 4px; min-height: 26px; line-height: 1; box-shadow: 1.5px 1.5px var(--ink); }
      .performer-caption kbd { width: 13px; height: 15px; font-size: 10px; border-radius: 2px; }
      .floor-shadow { bottom: 33px; height: 7px; }
      .art-rig { width: 98%; }
      .foil { width: min(85%, 170px); height: 66%; top: 14%; }
      .burst { width: 19px; height: 24px; left: 71%; }
      .console { --matrix: 45px repeat(8, minmax(0, 1fr)); --pad-gap: 4px; padding: 10px 9px 10px; }
      .console-top { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 13px; }
      .play-toggle { min-width: 92px; min-height: 39px; padding-inline: 9px; gap: 4px; font-size: 12px; }
      .tempo { min-width: 0; width: auto; gap: 8px; }
      .tempo-value { font-size: 15px; }
      .presets { grid-column: span 2; justify-content: flex-start; margin: 0; gap: 5px; }
      .preset { min-width: 49px; min-height: 32px; padding-inline: 7px; font-size: 11px; }
      .preset-label { margin-right: 2px; font-size: 10px; }
      .matrix { margin-block: 5px 10px; gap: 7px; }
      .lane-name { font-size: 10px; gap: 4px; }
      .lane-name::before { width: 5px; height: 5px; }
      .pad { border-radius: 5px; min-height: 41px; }
      .pad::after { width: 4px; height: 4px; }
      .pad.is-beat::after { width: 6px; height: 6px; }
      .console[data-sheet="0"] [data-half="1"], .console[data-sheet="1"] [data-half="0"] { display: none; }
      .beat-mark:nth-of-type(4) { grid-column: 2 / span 4; }
      .beat-mark:nth-of-type(5) { grid-column: 6 / span 4; }
      .sheet-nav { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 8px; }
      .sheet-nav span { margin-right: 3px; color: #dfcfdc; font-size: 10px; }
      .sheet-btn {
        min-height: 30px;
        min-width: 44px;
        padding: 0 6px;
        border: 1px solid #8b748c;
        border-radius: 5px;
        background: #32233a;
        color: #fff1e1;
        font: 700 12px/1 var(--label);
      }
      .sheet-btn[aria-pressed="true"] { color: var(--ink); background: var(--tone-bass); border-color: var(--tone-bass); }
      .sheet-btn.has-beat:not([aria-pressed="true"]) { border-color: #d0e7ff; }
      .bottom-tools { gap: 6px; }
      .edit-tools { gap: 4px; }
      .deck-button { padding-inline: 7px; gap: 4px; min-height: 35px; font-size: 10px; }
      .deck-button .icon { width: 13px; height: 13px; }
      .footer { padding-block: 16px 12px; font-size: 10px; }
      .footer p:last-child { display: none; }
    }
    @media (max-width: 370px) {
      :root { --gutter: 13px; }
      .mast-tools .utility span { display: none; }
      .headline h1 { font-size: 61px; }
      .pitch h2 { font-size: 16px; }
      .pitch p { font-size: 10px; }
      .headline { min-height: 109px; }
      .console { --matrix: 41px repeat(8, minmax(0, 1fr)); --pad-gap: 3px; }
      .deck-button { padding-inline: 6px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0s !important; }
      .performer:hover .foil { scale: none; rotate: var(--mood-tilt); }
      .performer:hover .actor, .performer:active .actor { translate: none; }
    }

  <p class="notify" id="notify" role="status"></p>

  <script>
    "use strict";

    const $ = selector => document.querySelector(selector);
    const STEPS = 16;
    const names = ["底鼓", "军鼓", "踩镲", "贝斯"];
    const presets = {
      bounce: [[0, 6, 8, 10, 14], [4, 12], [0, 2, 4, 6, 8, 10, 12, 14, 15], [0, 3, 6, 8, 11, 14]],
      arcade: [[0, 4, 8, 12, 14], [4, 7, 12, 15], [0, 2, 3, 6, 8, 9, 10, 11, 14, 15], [0, 2, 5, 7, 8, 10, 13, 15]],
      half: [[0, 3, 7, 11], [8, 14], [0, 2, 5, 8, 10, 13, 15], [0, 4, 7, 10, 14]]
    };
    const encode = rows => rows.map(row => {
      let mask = 0;
      for (const step of row) mask |= 1 << step;
      return mask;
    });
    const rhythms = Object.fromEntries(Object.entries(presets).map(([key, value]) => [key, encode(value)]));
    const consolePanel = $("#console");
    const matrix = $("#matrix");
    const tempo = $("#tempo");
    const transport = $("#transport");
    const exportButton = $("#export");
    const undoButton = $("#undo");
    const muteButton = $("#mute");
    const notify = $("#notify");
    const help = $("#help");
    const compact = matchMedia("(max-width: 700px)");
    const reduced = matchMedia("(prefers-reduced-motion: reduce)");
    const presetButtons = [...document.querySelectorAll(".preset")];
    const sheetButtons = [...document.querySelectorAll(".sheet-btn")];
    const beatMarks = [...document.querySelectorAll(".beat-mark")];
    const performers = [...document.querySelectorAll(".performer")];
    const emblem = $(".pitch-star");
    let pattern = rhythms.bounce.slice();
    let bpm = Number(tempo.value);
    let muted = false;
    let editSheet = 0;
    let activeCell = { track: 0, step: 0 };
    let drag = null;
    let nowStep = -1;
    let noticeTimer;
    const history = [];

    function notice(message) {
      clearTimeout(noticeTimer);
      notify.textContent = message;
      noticeTimer = setTimeout(() => { notify.textContent = ""; }, 2500);
    }

    const lit = (track, step) => Boolean(pattern[track] & (1 << step));
    const pads = names.map((name, track) => {
      const lane = document.createElement("div");
      lane.className = "lane";
      lane.dataset.track = track;
      const label = document.createElement("span");
      label.className = "lane-name";
      label.textContent = name;
      lane.append(label);
      matrix.append(lane);
      return Array.from({ length: STEPS }, (_, step) => {
        const pad = document.createElement("button");
        pad.type = "button";
        pad.className = "pad";
        pad.classList.toggle("is-beat", step % 4 === 0);
        pad.dataset.step = step;
        pad.dataset.track = track;
        pad.dataset.half = step >> 3;
        pad.setAttribute("aria-label", name + " 第 " + (step + 1) + " 步");
        pad.tabIndex = track === 0 && step === 0 ? 0 : -1;
        lane.append(pad);
        return pad;
      });
    });

    function indicatePattern() {
      for (let track = 0; track < pads.length; track++) {
        for (let step = 0; step < STEPS; step++) {
          pads[track][step].setAttribute("aria-pressed", String(lit(track, step)));
        }
      }
      for (const button of presetButtons) {
        button.setAttribute("aria-pressed", String(pattern.every((mask, i) => mask === rhythms[button.dataset.pattern][i])));
      }
      undoButton.disabled = !history.length;
      $("#clear").disabled = pattern.every(mask => !mask);
