<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#efdff6">
  <meta name="description" content="把你的动作录成四秒一圈的分身，在同一张舞台上与刚才的自己合奏。">
  <title>回声剧团 · Encore</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%232a1740'/%3E%3Cpath d='M5 30C11 3 17 4 23 17s9 16 12-1' fill='none' stroke='%23ff875e' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M5 16c13 20 14 17 21 5s8-12 9-12' fill='none' stroke='%23c1c5ff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --lilac: #efdff6;
      --cream: #f9eedc;
      --dark: #291b3b;
      --dark-b: #302043;
      --ink: #301940;
      --muted: #644b63;
      --red: #cc412d;
      --key: #ffb58b;
      --darktext: #f5eaf4;
      --line: #7d5e7a4f;
      --lightline: #decae649;
      --side: clamp(18px, 4.9vw, 92px);
      --title: "Encore Han", "Songti SC", "Noto Serif CJK SC", SimSun, serif;
      --sans: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --roman: "Encore Grotesk", Arial, sans-serif;
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    *, *::after, *::before { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; color: var(--ink); background: var(--lilac); }
    h1, h2, h3, p { margin: 0; }
    button, input { font: inherit; }
    button { color: inherit; cursor: pointer; }
    button:disabled { cursor: default; }
    button { -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 2px solid #5d43bc; outline-offset: 4px; }
    .console :focus-visible { outline-color: #ffcfaa; outline-offset: 3px; }
    ::selection { color: #351a42; background: #ffc59b; }
    [hidden] { display: none !important; }
    .shell { width: min(calc(100% - 2 * var(--side)), 1450px); margin-inline: auto; }
    .symbols { position: absolute; width: 0; height: 0; overflow: hidden; }
    .icon { width: 19px; height: 19px; flex: none; vertical-align: middle; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .mast {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 61px;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--dark);
      font: 700 clamp(17px, 1.68vw, 25px)/1 var(--roman);
      letter-spacing: .13em;
    }
    .brand .icon { width: 30px; height: 30px; color: #5a3983; }
    .tools { display: flex; align-items: center; gap: 6px; }
    .head-button, .mini, .action {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      min-height: 36px;
      padding: 0 10px;
      border: 1px solid #72597991;
      border-radius: 2px;
      color: var(--ink);
      background: #f7ecf884;
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
      transition: background 160ms, border-color 160ms, color 160ms, transform 160ms;
    }
    .head-button .icon, .mini .icon { width: 16px; height: 16px; }
    .head-button:hover { background: #fff9ed; border-color: #76598d; }
    .head-button[aria-pressed="true"] { background: #3d2451; color: #fff5ee; }
    #mute .muted, #mute[aria-pressed="true"] .normal { display: none; }
    #mute[aria-pressed="true"] .muted { display: inline-block; }

    .stage {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      height: clamp(459px, calc(100svh - 266px), 763px);
      border-block: 1px solid #62434b5c;
      background: #f8ecd9;
    }
    #scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      touch-action: none;
    }
    #scene.is-drawing { cursor: none; }
    #scene:focus-visible { outline-offset: -5px; }
    .entrance {
      position: absolute;
      z-index: 1;
      left: max(var(--side), calc((100% - 1450px) / 2));
      top: clamp(36px, 8.1vh, 99px);
      width: min(380px, calc(100% - 2 * var(--side)));
      pointer-events: none;
    }
    .entrance h1 {
      margin-left: -.055em;
      color: #261a42;
      font: 900 clamp(64px, 7vw, 118px)/.96 var(--title);
      letter-spacing: -.052em;
      text-shadow: 0 2px 16px #fcf1db8f;
    }
    .entrance h1 span { display: block; }
    .entrance h1 span + span { margin-top: .043em; color: var(--red); }
    .entrance p {
      width: max-content;
      max-width: 100%;
      margin-top: clamp(16px, 3vh, 32px);
      padding: 6px 12px 6px 9px;
      border-left: 1px solid #a97e7d;
      background: #f9ecd6bb;
      color: #503648;
      font-size: clamp(12px, 1.15vw, 16px);
      font-weight: 620;
      line-height: 1.65;
      letter-spacing: .065em;
    }
    .cue {
      position: absolute;
      z-index: 2;
      top: clamp(12px, 3.4vh, 31px);
      right: max(var(--side), calc((100% - 1450px) / 2));
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 29px;
      max-width: calc(100% - 2 * var(--side));
      padding: 4px 9px;
      border: 1px solid #7d5e7a7a;
      border-radius: 2px;
      background: #fbf0d9d9;
      color: #493150;
      font-size: 12px;
      font-weight: 660;
      letter-spacing: .06em;
      pointer-events: none;
      white-space: nowrap;
    }
    .cue::before {
      width: 6px;
      height: 6px;
      flex: none;
      border-radius: 50%;
      background: #9e7185;
      content: "";
    }
    .cue[data-state="drawing"]::before { background: #f35b42; box-shadow: 0 0 8px #f35b4295; }
    .cue[data-state="playing"]::before { background: #564ab2; }
    .stage-legend {
      position: absolute;
      right: max(var(--side), calc((100% - 1450px) / 2));
      bottom: 15px;
      left: max(var(--side), calc((100% - 1450px) / 2));
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 12px;
      pointer-events: none;
    }
    .stage-legend span {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 3px 4px;
      border-radius: 1px;
      background: #faeedb94;
      color: #643f54;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      white-space: nowrap;
    }
    .stage-legend .icon { width: 15px; height: 15px; }
    .warning {
      position: absolute;
      inset: auto 15% 24%;
      padding: 10px;
      background: var(--cream);
      color: #55374c;
      text-align: center;
      font-size: 14px;
    }

    .console {
      padding-block: 13px 14px;
      color: var(--darktext);
      background: radial-gradient(ellipse at 11% 0%, #43284b, transparent 57%), var(--dark);
    }
    .transport {
      display: grid;
      grid-template-columns: auto minmax(115px, 1fr) auto;
      align-items: center;
      gap: clamp(13px, 2.4vw, 34px);
    }
    .play {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      min-width: 130px;
      min-height: 45px;
      padding: 0 12px;
      border: 1px solid var(--key);
      border-radius: 2px;
      color: #361d3e;
      background: var(--key);
      box-shadow: 0 2px #2b172f;
      font-size: 15px;
      font-weight: 810;
      white-space: nowrap;
      transition: background 140ms, border-color 140ms, transform 140ms;
    }
    .play:hover { background: #ffd1ac; border-color: #ffd1ac; }
    .play:active, .action:active { transform: translateY(1px); }
    .play[aria-pressed="true"] { background: #e8d8fb; border-color: #e8d8fb; }
    .play .icon { width: 18px; height: 18px; }
    .play .pause, .play[aria-pressed="true"] .start { display: none; }
    .play[aria-pressed="true"] .pause { display: inline-block; }
    .time {
      min-width: 0;
      display: grid;
      gap: 6px;
    }
    .time-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 9px;
      color: #e8dbe9;
      font-size: 11px;
      white-space: nowrap;
      letter-spacing: .09em;
    }
    #phase-time { font: 600 13px/1 var(--roman); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
    .timeline {
      --position: 0%;
      display: block;
      position: relative;
      height: 12px;
      border-block: 1px solid #bd9bb069;
      background:
        repeating-linear-gradient(90deg, #e2c5e884 0 1px, transparent 1px 12.5%),
        repeating-linear-gradient(90deg, #e2c5e845 0 1px, transparent 1px 3.125%),
        #1910207a;
    }
    .timeline::before {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--position);
      background: #dca8bf49;
      content: "";
    }
    .timeline::after {
      position: absolute;
      top: -2px;
      bottom: -2px;
      left: clamp(0px,var(--position),calc(100% - 2px));
      width: 2px;
      background: #ffd09f;
      content: "";
    }
    .transport-actions { display: flex; gap: 6px; }
    .action, .mini {
      color: var(--darktext);
      background: #291b39;
      border-color: #b491b377;
      min-height: 34px;
    }
    .action:hover:not(:disabled), .mini:hover:not(:disabled) { background: #5b3d61; border-color: #d9bbd6cc; }
    .action:disabled, .mini:disabled { opacity: .41; }
    .action .icon { width: 15px; height: 15px; }
    .actions-sub { display: contents; }
    .tracks {
      margin-top: 11px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(5px, 1vw, 13px);
    }
    .track {
      --spot: #ffb292;
      display: grid;
      grid-template-rows: auto auto;
      gap: 6px;
      min-width: 0;
      padding: 7px 8px 8px;
      border: 1px solid #b495b162;
      border-radius: 2px;
      background: #271a399a;
    }
    .track[data-i="1"] { --spot: #bdc9ff; }
    .track[data-i="2"] { --spot: #d8e492; }
    .track[data-i="3"] { --spot: #eec3fb; }
    .track.is-target { border-color: var(--spot); background: #44304a; }
    .track.is-muted .track-head { opacity: .63; }
    .track-head {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 5px;
      min-width: 0;
      min-height: 27px;
      padding: 0 3px;
      border: 0;
      background: transparent;
      text-align: start;
      white-space: nowrap;
    }
    .track-head .name {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--spot);
      font-size: 14px;
      font-weight: 680;
    }
    .track-head .name::before {
      display: block;
      width: 7px; height: 7px;
      flex: none;
      border-radius: 50%;
      background: var(--spot);
      content: "";
    }
    .track-head .track-status { color: #e3d5e8; font-size: 10px; }
    .track-head[aria-pressed="true"] .track-status { color: var(--spot); }
    .track-buttons { display: grid; grid-template-columns: 1fr 1fr auto; gap: 4px; }
    .mini {
      gap: 4px;
      min-height: 32px;
      width: 100%;
      padding: 0 4px;
      font-size: 11px;
    }
    .mini .icon { width: 14px; height: 14px; }
    .mini[aria-pressed="true"] { background: var(--spot); color: #2e1b3b; border-color: var(--spot); }
    .mini[data-op="mute"] { width: 31px; }
    .mini[data-op="mute"][aria-pressed="false"] .muted,
    .mini[data-op="mute"][aria-pressed="true"] .normal { display: none; }
    .track.is-empty .track-buttons { opacity: .46; }
    .track.is-empty .mini { opacity: 1; }
    .foot {
      display: flex;
      justify-content: space-between;
      gap: 11px;
      padding-block: 11px 13px;
      color: #53415c;
      font-size: 12px;
      line-height: 1.6;
    }
    .foot kbd { font: 650 13px/1 var(--roman); white-space: nowrap; }
    .foot b { color: var(--ink); }
    .notice {
      position: fixed;
      z-index: 5;
      right: max(var(--side), env(safe-area-inset-right));
      bottom: max(17px, env(safe-area-inset-bottom));
      max-width: min(39ch,calc(100vw - 36px));
      padding: 10px 12px;
      border: 1px solid #b187aa;
      border-radius: 2px;
      background: #f8ebdd;
      box-shadow: 0 5px 24px #37224349;
      color: #442754;
      font-size: 13px;
      font-weight: 640;
    }
    .notice:empty { display: none; }
    dialog {
      width: min(510px,calc(100vw - 35px));
      padding: clamp(21px,4vw,34px);
      color: var(--ink);
      background: #faf0e3;
      border: 1px solid #987e9c;
      border-radius: 2px;
      box-shadow: 0 12px 55px #33213cb9;
    }
    dialog::backdrop { background: #261b36c7; }
    .dialog-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .dialog-head h2 { font: 900 26px/1.17 var(--title); }
    .dialog-head .head-button { width: 36px; padding: 0; }
    .dialog-copy { margin-top: 16px; display: grid; gap: 11px; color: #4f354e; font-size: 14px; line-height: 1.65; }
    .dialog-copy b { color: #7e2f40; }

    @media (max-width: 930px) {
      .stage { height: clamp(436px,calc(100svh - 261px),700px); }
      .transport { gap: 11px; }
      .transport-actions { gap: 4px; }
      .action { padding-inline: 6px; gap: 4px; }
      .action .icon { width: 14px; height: 14px; }
    }
    @media (max-width: 680px) {
      :root { --side: clamp(15px,4.4vw,29px); }
      .mast { min-height: 49px; }
      .brand { gap: 6px; font-size: 16px; letter-spacing: .11em; }
      .brand .icon { width: 23px; height: 23px; }
      .tools { gap: 4px; }
      .head-button { min-height: 35px; min-width: 36px; padding: 0 6px; }
      .tools .head-button span { display: none; }
      .stage { height: clamp(400px,54svh,550px); }
      .entrance { top: 36px; }
      .entrance h1 { font-size: clamp(49px, 13vw, 77px); }
      .entrance h1 span { display: inline; }
      .entrance h1 span + span { margin: 0; }
      .entrance p { margin-top: 11px; font-size: 11px; line-height: 1.54; padding-block: 3px; }
      .cue { top: 9px; min-height: 21px; padding: 2px 6px; font-size: 9px; gap: 4px; }
      .cue::before { width: 5px; height: 5px; }
      .stage-legend { bottom: 9px; }
      .stage-legend span { gap: 4px; padding: 2px; font-size: 9px; }
      .stage-legend .icon { width: 12px; height: 12px; }
      .console { padding-block: 10px 12px; }
      .transport { grid-template-columns: auto minmax(0,1fr); gap: 8px 10px; }
      .transport-actions { grid-column: 1/-1; justify-content: flex-start; }
      .play { min-width: 105px; min-height: 40px; padding: 0 7px; gap: 4px; font-size: 13px; }
      .play .icon { width: 16px; height: 16px; }
      .time-head { font-size: 10px; letter-spacing: .035em; }
      .timeline { height: 9px; }
      .action { min-height: 34px; font-size: 11px; }
      .tracks { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 5px; margin-top: 8px; }
      .track { padding: 4px 5px 5px; gap: 3px; }
      .track-head { min-height: 28px; }
      .track-head .name { font-size: 12px; }
      .track-head .track-status { font-size: 9px; }
      .mini { min-height: 34px; font-size: 10px; }
      .mini[data-op="mute"] { width: 29px; }
      .foot { padding-block: 7px 10px; font-size: 11px; }
      .foot span:last-child { display: none; }
    }
    @media (max-width: 355px) {
      :root { --side: 12px; }
      .action { padding-inline: 4px; gap: 3px; }
      .action .icon { width: 12px; height: 12px; }
      .transport-actions { gap: 4px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0s !important; }
      #scene.is-drawing { cursor: crosshair; }

  <header class="mast shell">
    <div class="brand" lang="en"><svg class="icon" aria-hidden="true"><use href="#logo"/></svg>ENCORE</div>
    <div class="tools" role="group" aria-label="剧团工具">
      <button class="head-button" id="instructions" type="button" title="玩法" aria-label="玩法">
        <svg class="icon" aria-hidden="true"><use href="#info-icon"/></svg><span>玩法</span>
      </button>
      <button class="head-button" id="mute" type="button" title="静音" aria-label="静音" aria-pressed="false">
        <svg class="icon normal" aria-hidden="true"><use href="#sound-icon"/></svg>
        <svg class="icon muted" aria-hidden="true"><use href="#mute-icon"/></svg><span>静音</span>
      </button>
    </div>
  </header>

  <main>
    <section class="stage" id="stage" aria-labelledby="title">
      <canvas id="scene" tabindex="0" aria-label="在舞台上拖动画出动作并录成分身。键盘可用方向键移动，按 Enter 开始或结束录制。"></canvas>
      <div class="entrance">
        <h1 id="title" aria-label="回声剧团"><span>回声</span><span>剧团</span></h1>
        <p>在舞台上画一道动作。<br>松手，和刚才的自己合奏。</p>
      </div>
      <span class="cue" id="cue" data-state="idle">按住舞台开始</span>
      <div class="stage-legend" aria-hidden="true">
        <span>向右移，音越高</span>
        <span><svg class="icon"><use href="#pitch-icon"/></svg>向上移，声音越亮</span>
      </div>
      <noscript><p class="warning">启用 JavaScript 即可画出分身和播放声音。</p></noscript>
    </section>

    <section class="console" aria-label="合奏控制台">
      <div class="shell">
        <div class="transport">
          <button class="play" id="play" type="button" aria-label="开始或暂停合奏" aria-pressed="false">
            <svg class="icon start" aria-hidden="true"><use href="#play-icon"/></svg>
            <svg class="icon pause" aria-hidden="true"><use href="#pause-icon"/></svg>
            <span id="play-text">开始合奏</span>
          </button>
          <div class="time">
            <div class="time-head"><span>四秒一圈</span><output id="phase-time" aria-label="循环中的位置">0.00 / 4.00</output></div>
            <div id="timeline" class="timeline" aria-hidden="true"></div>
          </div>
          <div class="transport-actions" role="group" aria-label="编排合奏">
            <button class="action" id="demo" type="button"><svg class="icon" aria-hidden="true"><use href="#demo-icon"/></svg>示范</button>
            <button class="action" id="clear" type="button"><svg class="icon" aria-hidden="true"><use href="#empty-icon"/></svg>清场</button>
            <button class="action" id="undo" type="button" disabled><svg class="icon" aria-hidden="true"><use href="#undo-icon"/></svg>撤销</button>
            <button class="action" id="export" type="button"><svg class="icon" aria-hidden="true"><use href="#download-icon"/></svg><span id="export-caption">导出 WAV</span></button>
          </div>
        </div>
        <div class="tracks" id="tracks" aria-label="四个分身声部"></div>
      </div>
    </section>

    <footer class="foot shell">
      <span><b>点声部名字</b> 选择本次录制的音色。倒序和镜像可独立改变每个分身。</span>
      <span><kbd>Space</kbd> 播放或暂停</span>
    </footer>
  </main>

  <dialog id="help" aria-labelledby="help-title">
    <form method="dialog">
      <div class="dialog-head"><h2 id="help-title">和自己的回声合奏</h2><button class="head-button" aria-label="关闭玩法"><svg class="icon" aria-hidden="true"><use href="#close-icon"/></svg></button></div>
    </form>
    <div class="dialog-copy">
      <p><b>画一下。</b> 按住舞台拖动，横向位置决定音高，画得越靠上，声音越明亮。松手后，动作与停顿会在每一圈的原位置回来。</p>
      <p><b>改一个分身。</b> 在它的声部按「倒序」，动作和音符从末尾回到开头。按「镜像」，左右位置和相应音高会反过来。</p>
      <p><b>用键盘演奏。</b> 用 Tab 聚焦舞台，方向键移动光点，Enter 开始或结束录制。按空格播放或暂停。</p>
    </div>
  </dialog>
  <p id="notice" class="notice" role="status"></p>
  <script>
  "use strict";

  const $ = selector => document.querySelector(selector);
  const LOOP = 4;
  const TAU = Math.PI * 2;
  const clamp = (n,min,max) => Math.min(max,Math.max(min,n));
  const mix = (a,b,t) => a+(b-a)*t;
  const wrap = (n,m=LOOP) => ((n%m)+m)%m;
  const seconds = () => performance.now()/1000;
  const scale = [0,2,4,7,9,12,14,16,19];
  const stage = $("#stage"), canvas = $("#scene"), ink = canvas.getContext("2d",{alpha:false});
  const help = $("#help");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const instruments = [
    {name:"朱红", root:57, color:"#f35945", light:[255,185,120], shade:[137,28,68], body:[241,65,57], text:"#651c37"},
    {name:"靛蓝", root:45, color:"#5263e7", light:[178,198,255], shade:[47,26,117], body:[66,91,230], text:"#291a67"},
    {name:"青苔", root:57, color:"#82a83c", light:[237,247,145], shade:[50,103,72], body:[131,178,58], text:"#315535"},
    {name:"玫紫", root:69, color:"#bf5fba", light:[253,184,233], shade:[112,32,123], body:[185,68,170], text:"#632253"}
  ];
  const clock = { running:false,zero:0,paused:0,until:0,timer:0,ready:false,token:0 };
  const view = {w:0,h:0,dpr:1,base:null,print:null,visible:true};
  const pointer = {x:.45,y:.59,show:false};
  const notesOnStage = [];
  const history = [];
  let slots = [];
  let selected = 2;
  let stroke;
  let engine;
  let audioPromise;
  let mute = false;
  let frame = 0;
  let redrawPrint = true;
  let noticeTimer;
  let lastCue;
  let lastPhase;
  let sequence = [];
  let folds = [];
  let saving = false;
  let didNotifyAudio = false;

  function notice(text) {
    clearTimeout(noticeTimer);
    $("#notice").textContent=text;
    noticeTimer=setTimeout(()=>{$("#notice").textContent="";},2780);
  }
  function blank() {
    return {take:null,reverse:false,mirror:false,mute:false,eligibleAfter:-1};
  }
  function grid() {
    return instruments.map(blank);
  }
  function takePoint(path,time) {
    let left=0,right=path.length-1;
    if(time<=path[0].t) return path[0];
    if(time>=path[right].t) return path[right];
    while(right-left>1) {
      const mid=(right+left)>>1;
      if(path[mid].t<=time) left=mid;
      else right=mid;
    }
    const a=path[left],b=path[right];
    const p=clamp((time-a.t)/Math.max(.00001,b.t-a.t),0,1);
    return {x:mix(a.x,b.x,p),y:mix(a.y,b.y,p),t:time};
  }

  function smooth(p0,p1,p2,p3,t) {
    // Catmull–Rom interpolation for the demonstration choreography.
    return .5*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t*t+(-p0+3*p1-3*p2+p3)*t*t*t);
  }
  function demoTake(keys,start,score) {
    const span=keys.at(-1)[0];
    const path=[];
    for(let i=0;i<keys.length-1;i++) {
      const a=keys[Math.max(i-1,0)],b=keys[i],c=keys[i+1],d=keys[Math.min(i+2,keys.length-1)];
      for(let k=0;k<12;k++) {
        const s=k/12;
        path.push({t:mix(b[0],c[0],s),x:clamp(smooth(a[1],b[1],c[1],d[1],s),.04,.96),
          y:clamp(smooth(a[2],b[2],c[2],d[2],s),.07,.94)});
      }
    }
    const end=keys.at(-1);
    path.push({t:end[0],x:end[1],y:end[2]});
    const notes=score.map(([at,velocity])=>({...takePoint(path,at),t:at,velocity}));
    return {start,span,path,notes};
  }
  function demo() {
    const out=grid();
    out[0].take=demoTake([
      [0,.425,.704],[.40,.479,.424],[.76,.568,.240],[1.02,.707,.216],
      [1.36,.792,.423],[1.62,.729,.718],[1.98,.595,.752],[2.30,.534,.620],
      [2.62,.638,.460],[2.91,.783,.465],[3.17,.872,.620],[3.56,.944,.428]
    ],.125,[[0,.81],[.374,.65],[.688,.66],[.865,.76],[1.125,.72],[1.438,.56],
      [1.750,.74],[1.999,.65],[2.251,.72],[2.622,.68],[2.872,.58],[3.122,.74],[3.499,.65]]);
    out[1].take=demoTake([
      [0,.270,.813],[.39,.377,.855],[.73,.488,.716],[1.08,.490,.519],
      [1.38,.541,.360],[1.76,.674,.375],[2.10,.768,.569],[2.48,.869,.736],
      [2.80,.909,.697],[3.17,.886,.444],[3.63,.810,.315]
    ],0,[[0,.76],[.494,.65],[.751,.69],[1.124,.68],[1.497,.74],[1.749,.57],
      [2.002,.8],[2.494,.67],[2.750,.66],[3.126,.62],[3.499,.68]]);
    return out;
  }

  function timeOfTransport() {
    return clock.running ? Math.max(clock.paused,seconds()-clock.zero) : clock.paused;
  }

  function arrangeNotes(parts) {
    const song=[];
    parts.forEach((slot,voice)=>{
      if(!slot.take || slot.mute) return;
      const take=slot.take;
      for(const note of take.notes) song.push({
        phase:wrap(take.start+(slot.reverse?take.span-note.t:note.t)), note,
        x:slot.mirror?1-note.x:note.x, voice, eligible:slot.eligibleAfter
      });
    });
    return song.sort((a,b)=>a.phase-b.phase);
  }
  function remember() {
    history.push({slots:slots.map(slot=>({...slot})),selected});
    if(history.length>34) history.shift();
  }
  function refresh() {
    sequence=arrangeNotes(slots);
    redrawPrint=true;
    showTracks();
    showStatus();
    requestDraw();
  }
  function replace(next,target) {
    if(stroke) finishStroke(false);
    remember();
    slots=next;
    selected=target;
    refresh();
  }
  function undo() {
    if(!history.length) return;
    if(stroke) finishStroke(false);
    const past=history.pop();
    slots=past.slots;
    selected=past.selected;
    refresh();
    notice("已撤销最近一次编排。");
  }

  function svg(name,kind="") {
    return '<svg class="icon '+kind+'" aria-hidden="true"><use href="#'+name+'"/></svg>';
  }
  const tracks = instruments.map((sound,i)=>{
    const article=document.createElement("div");
    article.className="track";
    article.dataset.i=i;
    article.innerHTML='<button class="track-head" type="button" title="选择此声部录制"><span class="name">'+sound.name+
      '</span><span class="track-status"></span></button><div class="track-buttons">'+
      '<button class="mini" data-op="reverse" type="button" title="倒序">'+svg("reverse-icon")+'倒序</button>'+
      '<button class="mini" data-op="mirror" type="button" title="左右镜像">'+svg("mirror-icon")+'镜像</button>'+
      '<button class="mini" data-op="mute" type="button" title="声部静音">'+svg("sound-icon","normal")+svg("mute-icon","muted")+'</button></div>';
    $("#tracks").append(article);
    const pick=article.querySelector(".track-head");
    pick.setAttribute("aria-label","选择"+sound.name+"声部");
    const state=article.querySelector(".track-status");
    const buttons=[...article.querySelectorAll(".mini")];
    pick.addEventListener("click",()=>{
      if(stroke) {notice("先松手，保存这一笔。");return;}
      selected=i;
      showTracks();
      showStatus();
    });
    for(const button of buttons) {
      const op=button.dataset.op;
      button.setAttribute("aria-label",sound.name+({reverse:"倒序",mirror:"镜像",mute:"静音"}[op]));
      button.addEventListener("click",()=>{
        if(!slots[i].take) return;
        remember();
        slots[i]={...slots[i],[op]:!slots[i][op]};
        refresh();
      });
    }
    return {article,pick,state,buttons};
  });
  function showTracks() {
    tracks.forEach(({article,pick,state,buttons},i)=>{
      const slot=slots[i];
      if(!slot) return;
      const target=i===selected;
      article.classList.toggle("is-target",target);
      article.classList.toggle("is-empty",!slot.take);
      article.classList.toggle("is-muted",slot.mute);
      pick.setAttribute("aria-pressed",String(target));
      state.textContent=stroke?.index===i?"录制中":target?(slot.take?"重录此声部":"待录制"):slot.take?"已录入":"空闲";
      for(const button of buttons) {
        button.disabled=!slot.take;
        button.setAttribute("aria-pressed",String(slot[button.dataset.op]));
      }
    });
    $("#undo").disabled=!history.length;
    $("#clear").disabled=slots.every(slot=>!slot.take);
    $("#export").disabled=saving || !sequence.length;
  }
  function showStatus() {
    const mode=stroke?"drawing":clock.running?"playing":"idle";
    const text=stroke ? "录制中 · 松手留下分身" : selected<0 ? "选一个声部可重录" : clock.running ? "合奏中" : "按住舞台开始";
    const token=mode+text;
    if(token===lastCue) return;
    lastCue=token;
    $("#cue").dataset.state=mode;
    $("#cue").textContent=text;
  }
  function showPlay() {
    $("#play").setAttribute("aria-pressed",String(clock.running));
    $("#play-text").textContent=clock.running?"暂停合奏":"开始合奏";
    showStatus();
  }

  function makeAudio(context) {
    const volume=context.createGain(), compressor=context.createDynamicsCompressor();
    volume.gain.value=.77;
    compressor.threshold.value=-15;
    compressor.knee.value=17;
    compressor.ratio.value=4.2;
    compressor.attack.value=.004;
    compressor.release.value=.14;
    const limit=context.createWaveShaper();
    limit.curve=Float32Array.from({length:1025},(_,i)=>.94*Math.tanh((i/512-1)*1.33)/Math.tanh(1.33));
    const analyser=context.createAnalyser?.();
    if(analyser) {
      analyser.fftSize=256;
      volume.connect(compressor).connect(limit).connect(analyser).connect(context.destination);
    } else volume.connect(compressor).connect(limit).connect(context.destination);
    const music=context.createGain();
    music.connect(volume);
    for(const [at,pan,loud] of [[.250,-.61,.135],[.375,.62,.103]]) {
      const delay=context.createDelay(.8), filter=context.createBiquadFilter();
      delay.delayTime.value=at;
      filter.type="lowpass";filter.frequency.value=2450;
      const send=context.createGain(), feedback=context.createGain();
      send.gain.value=loud;feedback.gain.value=.164;
      music.connect(delay).connect(filter).connect(feedback).connect(delay);
      filter.connect(send);
      const lane=context.createStereoPanner?.();
      if(lane) {lane.pan.value=pan;send.connect(lane).connect(volume);}
      else send.connect(volume);
    }
    function tone(out,shape,freq,when,peak,attack,tail,sweep) {
      const oscillator=context.createOscillator(), gain=context.createGain();
      oscillator.type=shape;
      oscillator.frequency.setValueAtTime(freq,when);
      if(sweep) oscillator.frequency.exponentialRampToValueAtTime(sweep[0],when+sweep[1]);
      gain.gain.setValueAtTime(.0001,when);
      gain.gain.exponentialRampToValueAtTime(Math.max(.00015,peak),when+attack);
      gain.gain.exponentialRampToValueAtTime(.0001,when+tail);
      oscillator.connect(gain).connect(out);
      oscillator.start(when);
      oscillator.stop(when+tail+.008);
    }
    function emit(voice,x,y,velocity,when) {
      const degree=clamp(Math.floor(x*scale.length),0,scale.length-1);
      const freq=440*2**((instruments[voice].root+scale[degree]-69)/12);
      const bright=1-y;
      const strength=velocity*(.68+.35*bright);
      const lane=context.createStereoPanner?.();
      if(lane) {lane.pan.value=clamp((x-.5)*1.38+(voice-1.5)*.105,-.9,.9);lane.connect(music);}
      const out=lane??music;
      if(voice===0) {
        tone(out,"sine",freq,when,.224*strength,.005,.48);
        tone(out,"sine",freq*2.003,when,.098*strength,.003,.232);
        tone(out,"sine",freq*4.008,when,(.029+.070*bright)*strength,.002,.116);
        tone(out,"sine",freq*6.2,when,.026*bright*strength,.002,.061);
      } else if(voice===1) {
        tone(out,"sine",freq*.5,when,.24*strength,.007,.373);
        tone(out,"triangle",freq,when,.177*strength,.005,.297);
        tone(out,"sine",freq*2,when,(.034+.089*bright)*strength,.003,.128);
      } else if(voice===2) {
        tone(out,"triangle",freq,when,.229*strength,.003,.215);
        tone(out,"sine",freq*2.49,when,(.05+.078*bright)*strength,.002,.063);
        tone(out,"sine",freq*3.07,when,.061*strength,.002,.095,[freq*2.76,.045]);
      } else {
        tone(out,"sine",freq,when,.17*strength,.021,.657);
        tone(out,"triangle",freq*1.003,when,.071*strength,.013,.476);
        tone(out,"sine",freq*2.006,when,(.027+.055*bright)*strength,.017,.391);
      }
    }
    let previous=.77;
    return {context,analyser,emit,level(next){
      if(next===previous) return;
      previous=next;
      const now=context.currentTime;
      volume.gain.cancelScheduledValues(now);
      volume.gain.setTargetAtTime(next,now,.026);
    }};
  }

  function openAudio() {
    if(audioPromise) return audioPromise;
    try {
      const Audio=window.AudioContext || window.webkitAudioContext;
      if(!Audio) throw new Error("Web Audio unavailable");
      engine??=makeAudio(new Audio());
      const resume=engine.context.state==="running"?Promise.resolve():engine.context.resume();
      audioPromise=resume.then(()=>{
        clock.ready=true;
        engine.level(mute?0:.77);
        return engine;
      }).catch(error=>{
        if(!didNotifyAudio) {didNotifyAudio=true;notice("动画可用，浏览器暂时未开启声音。");}
        throw error;
      }).finally(()=>{audioPromise=null;});
      return audioPromise;
    } catch(error) {
      if(!didNotifyAudio) {didNotifyAudio=true;notice("动画可用，浏览器暂时未开启声音。");}
      return Promise.reject(error);
    }
  }

  function spark(x,y,voice,when=timeOfTransport(),power=.8) {
    notesOnStage.push({x,y,voice,when,power});
    if(notesOnStage.length>36) notesOnStage.shift();
    requestDraw();
  }
  function playPreview(note,voice) {
    spark(note.x,note.y,voice,timeOfTransport(),note.velocity);
    if(mute) return;
    if(engine?.context.state==="running") {
      engine.level(.77);
      engine.emit(voice,note.x,note.y,note.velocity,engine.context.currentTime+.009);
    } else openAudio().then(audio=>{
      if(!mute && !document.hidden) audio.emit(voice,note.x,note.y,note.velocity,audio.context.currentTime+.011);
    }).catch(()=>{});
  }
  function playWindow(since,horizon,actual,notes) {
    for(const item of notes) {
      const cycle=Math.ceil((since-item.phase)/LOOP);
      const at=cycle*LOOP+item.phase;
      if(at<since-.00001 || at>=horizon || at<item.eligible || at<clock.paused-.0001) continue;
      if(clock.ready && engine?.context.state==="running") {
        engine.emit(item.voice,item.x,item.note.y,item.note.velocity,engine.context.currentTime+Math.max(.009,at-actual));
      }
      spark(item.x,item.note.y,item.voice,at,item.note.velocity);
    }
  }
  function schedule() {
    if(!clock.running) return;
    const actual=seconds()-clock.zero;
    if(!clock.ready && actual<.22) return;
    const horizon=actual+.090;
    if(horizon<=clock.until) return;
    playWindow(Math.max(clock.until,actual-.018),horizon,actual,sequence);
    clock.until=horizon;
  }
  function beginPlay(delay=.11) {
    if(clock.running) return;
    const token=++clock.token;
    clock.zero=seconds()+delay-clock.paused;
    clock.until=clock.paused-.00003;
    clock.running=true;
    const connect=openAudio();
    connect.then(()=>{
      if(token!==clock.token || !clock.running) return;
      schedule();
    }).catch(()=>{});
    clock.timer=setInterval(schedule,22);
    if(engine?.context.state==="running") schedule();
    redrawPrint=true;
    showPlay();
    requestDraw();
  }
  function pause() {
    if(stroke) finishStroke(true);
    ++clock.token;
    clock.paused=timeOfTransport();
    clock.running=false;
    clearInterval(clock.timer);
    notesOnStage.length=0;
    engine?.level(0);
    redrawPrint=true;
    showPlay();
    requestDraw();
  }
  function togglePlay() {
    if(clock.running) pause();
    else beginPlay();
  }

  function fromEvent(event) {
    const area=canvas.getBoundingClientRect();
    return {x:clamp((event.clientX-area.left)/Math.max(1,area.width),.012,.988),
      y:clamp((event.clientY-area.top)/Math.max(1,area.height),.016,.979)};
  }
  function startStroke(point,kind,id) {
    if(stroke) return;
    if(!clock.running) beginPlay(0);
    else if(!engine || engine.context.state!=="running") openAudio().catch(()=>{});
    const first=timeOfTransport();
    const voice=selected<0?0:selected;
    const note={...point,t:0,velocity:.78};
    stroke={kind,id,index:selected,voice,first,point,path:[{...point,t:0}],notes:[note],
      lastNote:first,lastPitch:Math.floor(point.x*scale.length),lastY:point.y,
      span:0,distance:0};
    pointer.x=point.x;pointer.y=point.y;pointer.show=true;
    canvas.classList.add("is-drawing");
    playPreview(note,voice);
    showTracks();
    showStatus();
    requestDraw();
  }
  function capturePoint(force=false) {
    if(!stroke) return;
    const now=timeOfTransport();
    const t=clamp(now-stroke.first,0,LOOP-.005);
    const last=stroke.path.at(-1);
    if(t>last.t+.022 || force && t>last.t+.00001) {
      stroke.path.push({...stroke.point,t});
      stroke.span=t;
    }
    if(t>=LOOP-.012) {
      finishStroke(true);
      notice("已留下完整的一圈。");
    }
  }
  function moveStroke(point) {
    if(!stroke) return;
    const runningStroke=stroke;
    const now=timeOfTransport();
    const dx=point.x-stroke.point.x,dy=point.y-stroke.point.y;
    const movement=Math.hypot(dx,dy);
    stroke.distance+=movement;
    stroke.point=point;
    pointer.x=point.x;pointer.y=point.y;
    capturePoint();
    if(!stroke || runningStroke!==stroke) return;
    const elapsed=now-stroke.lastNote;
    const pitch=Math.floor(point.x*scale.length);
    if(movement>.0015 && (elapsed>.107 && pitch!==stroke.lastPitch || elapsed>.256 &&
      (Math.abs(point.y-stroke.lastY)>.058 || movement>.009))) {
      const note={...point,t:clamp(now-stroke.first,0,LOOP-.006),velocity:clamp(.66+movement*3.8,.65,1.02)};
      stroke.notes.push(note);
      stroke.lastNote=now;stroke.lastPitch=pitch;stroke.lastY=point.y;
      playPreview(note,stroke.voice);
    }
  }
  function finishStroke(commit) {
    if(!stroke) return;
    const drawn=stroke;
    stroke=null;
    canvas.classList.remove("is-drawing");
    if(drawn.kind==="pointer") pointer.show=false;
    if(commit) {
      const at=timeOfTransport();
      const span=clamp(at-drawn.first,Math.min(drawn.span,LOOP-.005),LOOP-.005);
      const last=drawn.path.at(-1);
      if(span>last.t+.00001) drawn.path.push({...drawn.point,t:span});
      if(span>=.135 && (drawn.distance>.012 || span>.22)) {
        if(drawn.index>=0) {
          remember();
          const take={start:wrap(drawn.first),span,path:drawn.path,notes:drawn.notes};
          slots[drawn.index]={...blank(),take,eligibleAfter:drawn.first+LOOP-.00005};
          selected=slots.findIndex(slot=>!slot.take);
          refresh();
          if(clock.running && clock.until>at) {
            playWindow(at,clock.until,seconds()-clock.zero,sequence.filter(event=>event.voice===drawn.index));
          }
          notice(instruments[drawn.index].name+"分身会在下一圈回来。");
        } else notice("选择下方一个声部，再画一道新动作。");
      }
    }
    showTracks();
    showStatus();
    requestDraw();
  }

  function raster(w,h) {
    const tile=document.createElement("canvas");
    tile.width=w;tile.height=h;
    return tile;
  }
  function dot(ctx,x,y,r,color) {
    ctx.fillStyle=color;
    ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
  }
  function ring(ctx,x,y,r,color,width=1) {
    ctx.strokeStyle=color;
    ctx.lineWidth=width;
    ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.stroke();
  }
  function paper(ctx) {
    const {w,h}=view;
    const glaze=ctx.createLinearGradient(w*.04,0,w*.88,h);
    glaze.addColorStop(0,"#feefdb");glaze.addColorStop(.5,"#f8ead6");glaze.addColorStop(1,"#efd7d6");
    ctx.fillStyle=glaze;
    ctx.fillRect(0,0,w,h);
    const light=ctx.createRadialGradient(w*.28,h*.22,0,w*.49,h*.46,Math.max(w*.74,h));
    light.addColorStop(0,"#fff9e6e0");
    light.addColorStop(.37,"#fff6db57");
    light.addColorStop(1,"#ca9db225");
    ctx.fillStyle=light;
    ctx.fillRect(0,0,w,h);
    const grain=raster(167,167), paint=grain.getContext("2d");
    const film=paint.createImageData(167,167);
    let seed=63171;
    for(let i=0;i<film.data.length;i+=4) {
      seed=(Math.imul(seed,1664525)+1013904223)>>>0;
      const white=(seed&64)===64;
      film.data[i]=white?255:85;film.data[i+1]=white?248:48;film.data[i+2]=white?237:61;
      film.data[i+3]=(seed>>>22)%27;
    }
    paint.putImageData(film,0,0);
    ctx.globalAlpha=.48;
    ctx.fillStyle=ctx.createPattern(grain,"repeat");
    ctx.fillRect(0,0,w,h);
    ctx.globalAlpha=1;
    const margin=Math.max(13,Math.min(w*.05,88));
