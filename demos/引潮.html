<!doctype html>
<html lang="zh-CN" data-palette="cobalt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="引潮，一张可以触碰的月相版画。">
  <meta name="theme-color" content="#f5f0e4">
  <title>引潮 · Tidal Field</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='7' fill='%231b2499'/%3E%3Ccircle cx='20' cy='16' r='8' fill='%23ff9b63'/%3E%3Cpath d='M7 23c9-4 17 4 26 0m-26 5c9-4 17 4 26 0m-26 5c9-4 17 4 26 0' fill='none' stroke='%23fff0ce' stroke-width='1.5'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f0e4;
      --ink: #161d60;
      --key: #252da1;
      --signal: #c4492e;
      --line: #8283ac5b;
      --muted: #53546c;
      --roman: "Field Grotesk", Arial, sans-serif;
      --cjk: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
      --title: "Field Han", var(--cjk);
      --gutter: clamp(20px, 3.9vw, 74px);
      font-family: var(--cjk);
      -webkit-font-smoothing: antialiased;
    }
    :root[data-palette="iris"] { --paper: #f4edf2; --ink: #412456; --key: #673682; --signal: #ad3677; --muted: #64546b; --line: #92719567; }
    :root[data-palette="moss"] { --paper: #f0f1dd; --ink: #233e2d; --key: #345c36; --signal: #996016; --muted: #4a6054; --line: #66836d69; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); transition: color 460ms, background-color 550ms; }
    body.has-immersion { overflow: hidden; }
    button, input { font: inherit; }
    button { color: inherit; cursor: pointer; }
    a { color: inherit; }
    button, input, a { -webkit-tap-highlight-color: transparent; }
    h1, p { margin: 0; }
    :focus-visible { outline: 2px solid var(--signal); outline-offset: 4px; }
    ::selection { color: var(--paper); background: var(--key); }
    .shell { width: min(calc(100% - 2 * var(--gutter)), 1580px); margin-inline: auto; }
    .symbol-set { position: absolute; width: 0; height: 0; overflow: hidden; }
    .icon { width: 18px; height: 18px; flex: none; vertical-align: middle; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 71px;
      gap: 14px;
      border-bottom: 1px solid var(--ink);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 11px;
      font: 700 clamp(14px, 1.45vw, 22px)/1 var(--roman);
      letter-spacing: .115em;
      white-space: nowrap;
    }
    .logo .icon { width: 32px; height: 32px; }
    .mark-light { fill: var(--signal); }
    .top-actions { display: flex; align-items: center; gap: 9px; }
    .header-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 40px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: transparent;
      color: var(--ink);
      font-size: 12px;
      letter-spacing: .06em;
      white-space: nowrap;
      transition: color 160ms, background-color 160ms, border-color 160ms;
    }
    .header-button:hover { border-color: var(--key); }
    .header-button[aria-pressed="true"] { color: var(--paper); background: var(--key); border-color: var(--key); }
    .sound-positive, .header-button[aria-pressed="true"] .sound-negative { display: none; }
    .header-button[aria-pressed="true"] .sound-positive { display: block; }
    .header-button:disabled { opacity: .68; cursor: wait; }

    .layout {
      display: grid;
      grid-template-columns: clamp(225px, 20.4vw, 326px) minmax(0, 1fr);
      grid-template-rows: auto 1fr;
      grid-template-areas: "intro viewer" "settings viewer";
      column-gap: clamp(25px, 3.2vw, 58px);
      padding-block: clamp(22px, 3.65vh, 45px) 0;
      align-items: start;
    }
    .intro { grid-area: intro; padding: clamp(22px, 4.7vw, 65px) 0 0; }
    .context {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--key);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .18em;
    }
    .context .icon { color: var(--signal); width: 16px; height: 16px; }
    .intro h1 {
      margin: 17px 0 19px -.077em;
      font: 900 clamp(81px, 8.45vw, 142px)/1 var(--title);
      letter-spacing: -.09em;
      white-space: nowrap;
    }
    .intro p:last-child {
      color: var(--muted);
      max-width: 18em;
      font-size: clamp(13px, 1.08vw, 16px);
      font-weight: 450;
      line-height: 1.85;
      letter-spacing: .06em;
    }
    .settings { grid-area: settings; padding-top: clamp(27px, 6.35vh, 71px); }
    .setting { border-top: 1px solid var(--line); padding: 16px 0 17px; }
    .setting-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 9px;
      margin-bottom: 12px;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .11em;
    }
    .tide-value { font-size: 12px; color: var(--key); font-weight: 680; letter-spacing: .04em; }
    .tide-track {
      --tide: 58%;
      position: relative;
      width: 100%;
      height: 5px;
      border-radius: 1px;
      overflow: hidden;
      background: var(--line);
    }
    .tide-track::after {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--tide);
      background: linear-gradient(90deg, var(--key), var(--signal));
      content: "";
    }
    .setting-note { margin-top: 9px; color: var(--muted); font-size: 10px; line-height: 1.7; letter-spacing: .06em; }
    .palettes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
    .palette {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: clamp(4px, .6vw, 8px);
      min-height: 40px;
      min-width: 0;
      padding: 0 3px;
      border: 1px solid transparent;
      border-radius: 2px;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
      transition: color 160ms, border-color 160ms, background-color 160ms;
    }
    .palette:hover, .palette[aria-pressed="true"] { color: var(--ink); border-color: var(--line); background: #ffffff48; }
    .palette[aria-pressed="true"] { border-color: var(--key); font-weight: 680; }
    .swatch {
      width: 17px;
      height: 17px;
      flex: none;
      border-radius: 50%;
      border: 1px solid #241b5229;
      background: linear-gradient(139deg, var(--swatch-a) 49%, var(--swatch-b) 50%);
    }
    [data-color="cobalt"] { --swatch-a: #2838cf; --swatch-b: #ff9e50; }
    [data-color="iris"] { --swatch-a: #742e8f; --swatch-b: #ffb8d4; }
    [data-color="moss"] { --swatch-a: #266756; --swatch-b: #e6f388; }
    .motion {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      min-height: 49px;
      border: 0;
      border-block: 1px solid var(--line);
      padding: 0;
      background: none;
      color: var(--ink);
      text-align: start;
      font-size: 12px;
      font-weight: 610;
      letter-spacing: .1em;
    }
    .motion > span:first-child { display: flex; align-items: center; gap: 8px; }
    .motion > span:first-child .icon { width: 16px; height: 16px; }
    .switch-track {
      position: relative;
      width: 32px;
      height: 18px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: #ffffff78;
      transition: background-color 180ms, border-color 180ms;
    }
    .switch-track::after {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--key);
      content: "";
      transition: transform 180ms, background 180ms;
    }
    .motion[aria-pressed="true"] .switch-track { background: var(--key); border-color: var(--key); }
    .motion[aria-pressed="true"] .switch-track::after { transform: translateX(14px); background: var(--paper); }

    .viewer { grid-area: viewer; min-width: 0; }
    .art {
      position: relative;
      isolation: isolate;
      height: clamp(420px, calc(100svh - 302px), 777px);
      overflow: hidden;
      border-radius: 3px;
      color: #fff3dc;
      background: #1b2599;
      box-shadow: 0 25px 38px -32px #1b224b9e;
    }
    .art :focus-visible { outline-color: #fff2c4; }
    .art canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }
    .art canvas.is-dragging { cursor: grabbing; }
    .art-inset {
      position: absolute;
      inset: 15px;
      pointer-events: none;
      opacity: .55;
      background:
        linear-gradient(currentColor, currentColor) left top / 8px 1px,
        linear-gradient(currentColor, currentColor) left top / 1px 8px,
        linear-gradient(currentColor, currentColor) right top / 8px 1px,
        linear-gradient(currentColor, currentColor) right top / 1px 8px,
        linear-gradient(currentColor, currentColor) left bottom / 8px 1px,
        linear-gradient(currentColor, currentColor) left bottom / 1px 8px,
        linear-gradient(currentColor, currentColor) right bottom / 8px 1px,
        linear-gradient(currentColor, currentColor) right bottom / 1px 8px;
      background-repeat: no-repeat;
    }
    .readout {
      position: absolute;
      z-index: 1;
      top: clamp(24px, 2.7vw, 39px);
      right: clamp(24px, 2.7vw, 39px);
      display: grid;
      justify-items: end;
      gap: 5px;
      text-align: end;
      pointer-events: none;
      text-shadow: 0 1px 12px #101540a8;
    }
    .readout-label { color: #fff3dcd6; font-size: 10px; letter-spacing: .15em; }
    .phase-name { font-size: clamp(20px, 2vw, 32px); font-weight: 670; letter-spacing: .075em; line-height: 1.15; }
    .lit { color: #fff3dce0; font-size: 10px; letter-spacing: .11em; }
    .lit b { font: 600 13px/1 var(--roman); letter-spacing: .02em; }
    .plate-actions {
      position: absolute;
      inset: auto clamp(23px, 2.3vw, 33px) clamp(23px, 2.3vw, 33px);
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      gap: 10px;
    }
    .glass-button {
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid #fff0cc6b;
      border-radius: 2px;
      background: #0b13399e;
      color: #fff1d7;
      white-space: nowrap;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .07em;
      transition: background-color 180ms, border-color 180ms, transform 180ms;
    }
    .glass-button:hover { background: #0b1339e6; border-color: #fff0ccbf; }
    .glass-button:active { transform: scale(.97); }
    .glass-button .icon { width: 16px; height: 16px; }
    .immersive-close { display: none; position: absolute; top: clamp(24px, 2.7vw, 39px); left: clamp(24px, 2.7vw, 39px); }
    .viewer.is-immersive {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      padding: clamp(8px, 1.3vw, 19px) clamp(8px, 1.3vw, 19px) 3px;
      background: var(--paper);
      overflow: auto;
    }
    .viewer.is-immersive .art { height: 100%; min-height: 170px; }
    .viewer.is-immersive .immersive-close { display: inline-flex; }
    .viewer.is-immersive .timeline { padding-block: 10px 2px; }
    .viewer.is-immersive .phase-tab { min-height: 39px; }
    .art-problem { position: absolute; inset: 42% 12% auto; text-align: center; color: #fff2cb; z-index: 1; }

    .timeline { padding: 15px 0 0; }
    .transport {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: clamp(12px, 1.7vw, 25px);
    }
    .playback {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      height: 43px;
      min-width: 86px;
      border: 1px solid var(--key);
      border-radius: 2px;
      padding: 0 12px;
      background: var(--key);
      color: var(--paper);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .1em;
      transition: color 180ms, background-color 180ms;
    }
    .playback:hover { background: var(--ink); }
    .playback[aria-pressed="true"] { background: transparent; color: var(--key); }
    .playback .icon { width: 15px; height: 15px; }
    .pause-symbol, .playback[aria-pressed="true"] .play-symbol { display: none; }
    .playback[aria-pressed="true"] .pause-symbol { display: inline-block; }
    .ruler-labels {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .08em;
      padding: 2px 1px 0;
      white-space: nowrap;
    }
    .ruler-labels > span:last-child { text-align: right; }
    .age { color: var(--ink); font-size: 11px; font-weight: 620; }
    .ruler-labels b { font: 600 12px/1 var(--roman); }
    .slider {
      --progress: 37.5%;
      --thumb: 15px;
      display: block;
      width: 100%;
      height: 26px;
      margin: 0;
      padding: 0;
      appearance: none;
      background: transparent;
      color: var(--key);
      cursor: ew-resize;
    }
    .slider::-webkit-slider-runnable-track {
      height: 3px;
      border-radius: 1px;
      background: linear-gradient(90deg, var(--key) var(--progress), var(--line) var(--progress));
    }
    .slider::-moz-range-track {
      height: 3px;
      border-radius: 1px;
      background: linear-gradient(90deg, var(--key) var(--progress), var(--line) var(--progress));
    }
    .slider::-webkit-slider-thumb {
      appearance: none;
      width: var(--thumb);
      height: var(--thumb);
      margin-top: -6px;
      border: 2px solid var(--paper);
      border-radius: 50%;
      background: var(--signal);
      box-shadow: 0 0 0 1px var(--signal);
    }
    .slider::-moz-range-thumb {
      width: 11px;
      height: 11px;
      border: 2px solid var(--paper);
      border-radius: 50%;
      background: var(--signal);
      box-shadow: 0 0 0 1px var(--signal);
    }
    .phases {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: clamp(2px, 1vw, 11px);
      margin-top: 8px;
    }
    .phase-tab {
      display: grid;
      justify-items: center;
      align-content: center;
      gap: 5px;
      min-height: 51px;
      padding: 3px 0;
      border: 1px solid transparent;
      border-radius: 2px;
      background: none;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
      letter-spacing: .09em;
      transition: color 160ms, background-color 160ms, border-color 160ms;
    }
    .phase-tab svg { width: 17px; height: 17px; color: var(--key); }
    .phase-tab:hover { background: #fff7; border-color: var(--line); color: var(--ink); }
    .phase-tab[aria-pressed="true"] { color: var(--key); background: #fffc; border-color: var(--line); font-weight: 700; }
    .phase-tab[aria-pressed="true"] svg { color: var(--signal); }
    .foot {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      min-height: 49px;
      margin-top: clamp(17px, 3.1vh, 30px);
      padding-block: 10px;
      gap: 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .07em;
    }
    .foot a { text-underline-offset: 3px; line-height: 2; }
    .foot span { line-height: 2; }
    .foot kbd { font: 550 11px/1 var(--roman), var(--cjk); margin-right: 3px; }
    .toast {
      position: fixed;
      right: max(15px, env(safe-area-inset-right));
      bottom: max(17px, env(safe-area-inset-bottom));
      z-index: 20;
      max-width: min(39ch, calc(100vw - 30px));
      padding: 12px 15px;
      background: var(--ink);
      color: var(--paper);
      font-size: 12px;
      box-shadow: 0 5px 18px #14152e38;
      border-radius: 3px;
    }
    .toast:empty { display: none; }
    @media (max-width: 890px) {
      :root { --gutter: clamp(17px, 3.4vw, 34px); }
      .layout { grid-template-columns: 183px minmax(0, 1fr); column-gap: 24px; }
      .intro h1 { font-size: 81px; }
      .palettes { gap: 2px; }
      .swatch { width: 13px; height: 13px; }
      .palette { font-size: 10px; }
      .art { height: clamp(410px, calc(100svh - 276px), 625px); }
    }
    @media (max-width: 650px) {
      .topline { min-height: 62px; }
      .logo { gap: 7px; }
      .logo .icon { width: 27px; height: 27px; }
      .top-actions { gap: 5px; }
      .header-button { min-width: 43px; min-height: 42px; padding: 0 8px; }
      .header-button span { display: none; }
      .layout { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto; grid-template-areas: "intro" "viewer" "settings"; gap: 17px; padding-top: 19px; }
      .intro {
        display: grid;
        grid-template-columns: auto 1fr;
        grid-template-areas: "context context" "title sentence";
        align-items: end;
        gap: 7px clamp(20px, 6vw, 39px);
        padding: 0;
      }
      .context { grid-area: context; font-size: 10px; gap: 6px; }
      .context .icon { width: 13px; height: 13px; }
      .intro h1 { grid-area: title; margin: 0 0 1px -.065em; font-size: clamp(56px, 15.1vw, 84px); }
      .intro p:last-child { grid-area: sentence; font-size: 12px; line-height: 1.65; max-width: 16em; margin-bottom: 1px; }
      .art { height: clamp(342px, 47svh, 490px); }
      .art-inset { inset: 10px; }
      .readout { top: 19px; right: 18px; gap: 4px; }
      .readout-label, .lit { font-size: 9px; }
      .phase-name { font-size: 19px; }
      .plate-actions { inset: auto 16px 16px; }
      .glass-button { min-height: 39px; padding-inline: 8px; font-size: 10px; }
      .export-caption { display: none; }
      .glass-button[data-save] { min-width: 39px; }
      .immersive-close { left: 16px; top: 16px; }
      .timeline { padding-top: 10px; }
      .transport { gap: 10px; }
      .playback { min-width: 65px; height: 40px; padding-inline: 6px; font-size: 11px; gap: 3px; }
      .phases { margin-top: 4px; }
      .phase-tab { min-height: 44px; gap: 4px; font-size: 9px; letter-spacing: -.02em; }
      .phase-tab svg { width: 15px; height: 15px; }
      .settings { display: grid; grid-template-columns: 1fr 1fr; column-gap: 16px; padding-top: 1px; }
      .setting { padding: 13px 0 11px; }
      .setting-title { font-size: 11px; }
      .setting-note { font-size: 9px; }
      .palette { gap: 4px; min-height: 35px; }
      .motion { grid-column: span 2; font-size: 11px; }
      .foot { min-height: 41px; margin-top: 12px; text-align: start; }
      .key-hint { display: none; }
    }
    @media (max-width: 370px) {
      .palettes { gap: 1px; }
      .swatch { width: 10px; height: 10px; }
      .palette { gap: 2px; }
      .intro p:last-child { font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) {

  <header class="topline shell">
    <div class="logo" lang="en"><svg class="icon" aria-hidden="true"><use href="#mark"/></svg>TIDAL FIELD</div>
    <div class="top-actions">
      <button class="header-button" id="sound" type="button" aria-label="海浪声" aria-pressed="false" title="海浪声">
        <svg class="icon sound-negative" aria-hidden="true"><use href="#audio-off"/></svg>
        <svg class="icon sound-positive" aria-hidden="true"><use href="#audio-on"/></svg>
        <span>海浪声</span>
      </button>
      <button class="header-button" id="enter" type="button" aria-label="进入沉浸模式" title="沉浸模式">
        <svg class="icon" aria-hidden="true"><use href="#expand"/></svg><span>沉浸模式</span>
      </button>
    </div>
  </header>

  <main class="layout shell">
    <section class="intro" aria-labelledby="title">
      <p class="context"><svg class="icon" aria-hidden="true"><use href="#star"/></svg>月相与潮汐</p>
      <h1 id="title">引潮</h1>
      <p>拨动月相，看一片海随光起伏。</p>
    </section>

    <section class="viewer" id="viewer" aria-label="引潮画布与月相控制">
      <div class="art" id="art">
        <canvas id="print" role="img" aria-label="明亮的橙色月亮悬在钴蓝海面上，月光穿过流动的潮线。"></canvas>
        <div class="art-inset" aria-hidden="true"></div>
        <p class="readout">
          <span class="readout-label">月相 · 北半球</span>
          <span class="phase-name" id="phase">盈凸月</span>
          <span class="lit"><b id="lit">85%</b> 受光</span>
        </p>
        <button class="glass-button immersive-close" id="exit" type="button"><svg class="icon" aria-hidden="true"><use href="#close"/></svg>退出沉浸</button>
        <div class="plate-actions">
          <button class="glass-button" id="stir" type="button" aria-label="激起一圈涟漪" title="也可以直接点触或拖动海面"><svg class="icon" aria-hidden="true"><use href="#ripple"/></svg>点触或拖动海面</button>
          <button class="glass-button" data-save type="button" aria-label="保存当前画面" title="保存当前画面"><svg class="icon" aria-hidden="true"><use href="#save"/></svg><span class="export-caption">保存画面</span></button>
        </div>
        <noscript><p class="art-problem">启用 JavaScript 后即可绘制版画。</p></noscript>
      </div>
      <div class="timeline">
        <div class="transport">
          <button class="playback" id="playback" type="button" aria-label="自动播放月相" aria-pressed="false" title="自动播放月相 · 空格">
            <svg class="icon play-symbol" aria-hidden="true"><use href="#play"/></svg>
            <svg class="icon pause-symbol" aria-hidden="true"><use href="#pause"/></svg>
            <span id="play-caption">播放</span>
          </button>
          <div>
            <div class="ruler-labels" aria-hidden="true"><span><b>0</b> 日</span><span class="age">月龄 <b id="age">11.1</b> 日</span><span><b>29.5</b> 日</span></div>
            <label class="sr-only" for="lunation">月相时间轴</label>
            <input class="slider" id="lunation" type="range" min="0" max="240" value="90" step="1" aria-valuetext="月龄 11.1 日，盈凸月，受光 85%">
          </div>
        </div>
        <div class="phases" id="phases" role="group" aria-label="八种月相"></div>
      </div>
      <p class="toast" id="toast" role="status"></p>
    </section>

    <aside class="settings" aria-label="潮线与色谱">
      <div class="setting">
        <div class="setting-title"><span id="tide-label">相对潮差</span><span class="tide-value" id="tide-value">中等</span></div>
        <div class="tide-track" role="meter" aria-labelledby="tide-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="60" aria-valuetext="中等"></div>
        <p class="setting-note">大潮出现在新月和满月附近。</p>
      </div>
      <div class="setting">
        <div class="setting-title" id="palette-title">版画色谱</div>
        <div class="palettes" role="group" aria-labelledby="palette-title">
          <button class="palette" data-color="cobalt" type="button" aria-pressed="true"><span class="swatch" aria-hidden="true"></span>钴蓝</button>
          <button class="palette" data-color="iris" type="button" aria-pressed="false"><span class="swatch" aria-hidden="true"></span>暮紫</button>
          <button class="palette" data-color="moss" type="button" aria-pressed="false"><span class="swatch" aria-hidden="true"></span>苔绿</button>
        </div>
      </div>
      <button class="motion" id="motion" type="button" aria-pressed="true">
        <span><svg class="icon" aria-hidden="true"><use href="#wave"/></svg>海面动效</span>

      </button>
    </aside>
  </main>

  <footer class="foot shell">
    <a href="https://oceanservice.noaa.gov/education/tutorial_tides/tides06_variations.html" target="_blank" rel="noopener noreferrer">潮差原理 ↗</a>
    <span class="key-hint"><kbd>← →</kbd>微调月相　<kbd>空格</kbd>播放和暂停</span>
  </footer>
  <script>
    "use strict";

    const $ = selector => document.querySelector(selector);
    const TAU = Math.PI * 2;
    const DAY_COUNT = 29.53;
    const INITIAL = .375;
    const clamp = (x, low = 0, high = 1) => Math.min(high, Math.max(low, x));
    const lerp = (a, b, t) => a + (b - a) * t;
    const ease = t => t * t * (3 - 2 * t);
    const rgb = ([r, g, b], a = 1) => "rgba(" + Math.round(r) + "," + Math.round(g) + "," + Math.round(b) + "," + a + ")";
    const mix = (a, b, t) => a.map((c, i) => lerp(c, b[i], t));
    const colorways = {
      cobalt: {
        sky: [39, 55, 191], dusk: [13, 17, 79], air: [108, 135, 255], reflection: [255, 177, 107],
        sea: [163, 171, 255], light: [255, 236, 174], ember: [242, 86, 47], shadow: [32, 26, 102], orbit: [218, 218, 255]
      },
      iris: {
        sky: [99, 41, 128], dusk: [29, 11, 61], air: [217, 101, 205], reflection: [255, 166, 211],
        sea: [227, 152, 248], light: [255, 233, 224], ember: [228, 84, 154], shadow: [61, 24, 89], orbit: [255, 211, 242]
      },
      moss: {
        sky: [29, 102, 79], dusk: [5, 33, 37], air: [120, 186, 131], reflection: [225, 244, 136],
        sea: [138, 217, 181], light: [254, 251, 185], ember: [155, 169, 60], shadow: [30, 70, 55], orbit: [215, 252, 204]
      }
    };
    const phases = ["新月", "娥眉月", "上弦月", "盈凸月", "满月", "亏凸月", "下弦月", "残月"];
    const icons = [
      "",
      "M10 2.5a7.5 7.5 0 0 1 0 15c7.05-4.1 7.05-10.9 0-15Z",
      "M10 2.5a7.5 7.5 0 0 1 0 15Z",
      "M10 2.5a7.5 7.5 0 0 1 0 15c-7.05-4.1-7.05-10.9 0-15Z",
      "M10 2.5a7.5 7.5 0 1 1 0 15a7.5 7.5 0 1 1 0-15Z",
      "M10 2.5a7.5 7.5 0 0 0 0 15c7.05-4.1 7.05-10.9 0-15Z",
      "M10 2.5a7.5 7.5 0 0 0 0 15Z",
      "M10 2.5a7.5 7.5 0 0 0 0 15c-7.05-4.1-7.05-10.9 0-15Z"
    ];
    const art = $("#art");
    const viewer = $("#viewer");
    const canvas = $("#print");
    const ctx = canvas.getContext("2d", { alpha: false });
    const backdrop = document.createElement("canvas");
    const sky = backdrop.getContext("2d", { alpha: false });
    const media = matchMedia("(prefers-reduced-motion: reduce)");
    const timeline = $("#lunation");
    const phaseText = $("#phase");
    const lightText = $("#lit");
    const ageText = $("#age");
    const tideText = $("#tide-value");
    const meter = $(".tide-track");
    const playButton = $("#playback");
    const playCaption = $("#play-caption");
    const motionButton = $("#motion");
    const paletteButtons = [...document.querySelectorAll(".palette")];
    const phaseGroup = $("#phases");
    const enter = $("#enter");
    const exit = $("#exit");
    const toast = $("#toast");
    const live = {
      phase: INITIAL, playing: false, motion: !media.matches,
      color: colorways.cobalt, theme: "cobalt", motionTime: 2.45, effectTime: 0,
      ripples: [], phaseTween: null, paletteTween: null, visible: true
    };
    const dims = { w: 0, h: 0, dpr: 1, mx: 0, my: 0, mr: 0, shore: 0, waveProfile: null };
    let frame = 0;
    let startTime = 0;
    let skyDirty = true;
    let fieldGradient;
    let waterShade;
    let lightCache = { phase: -1, color: null };
    let toastTimer;
    let upPointer = null;
    let immersive = false;
    let soundBed;
    let lastPhaseName = -1;
    let lastReading = "";
    let lastGauge = -1;

    const buttons = phases.map((name, i) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "phase-tab";
      button.dataset.phase = i;
      button.setAttribute("aria-pressed", String(i === 3));
      button.innerHTML = '<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor"/><path d="' +
        icons[i] + '" fill="currentColor"/></svg>' + name;
      button.addEventListener("click", () => seek(i / 8, true));
      phaseGroup.append(button);
      return button;
    });
    phaseGroup.addEventListener("keydown", event => {
      const index = buttons.indexOf(event.target);
      if (index < 0) return;
      let next;
      switch (event.key) {
        case "ArrowLeft": next = (index + 7) % 8; break;
        case "ArrowRight": next = (index + 1) % 8; break;
        case "Home": next = 0; break;
        case "End": next = 7; break;
        default: return;
      }
      event.preventDefault();
      buttons[next].focus();
      seek(next / 8, true);
    });

    function notice(text) {
      clearTimeout(toastTimer);
      toast.textContent = text;
      toastTimer = setTimeout(() => { toast.textContent = ""; }, 2400);
    }

    function rng(seed) {
      return () => {
        seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
        return seed / 4294967296;
      };
    }

    function newGrain() {
      const tile = document.createElement("canvas");
      tile.width = tile.height = 181;
      const paint = tile.getContext("2d");
      const image = paint.createImageData(tile.width, tile.height);
      const rand = rng(67439);
      for (let i = 0; i < image.data.length; i += 4) {
        const value = rand() < .56 ? 0 : 255;
        image.data[i] = image.data[i + 1] = image.data[i + 2] = value;
        image.data[i + 3] = Math.round(rand() * 59);
      }
      paint.putImageData(image, 0, 0);
      return tile;
    }

    const grain = newGrain();
    const random = rng(90219);
    const stars = Array.from({length: 122}, () => ({ x: random(), y: random(), a: random(), size: random() }));
    const sparks = Array.from({length: 170}, () => ({ x: random(), y: random(), a: random(), k: random() * TAU }));

    // The disc is generated once. Lighting changes independently of its printed surface.
    function makeSphere() {
      const disc = document.createElement("canvas");
      const size = disc.width = disc.height = 400;
      const paint = disc.getContext("2d");
      const image = paint.createImageData(size, size);
      const total = size * size;
      const nx = new Float32Array(total);
      const ny = new Float32Array(total);
      const nz = new Float32Array(total);
      const texture = new Float32Array(total);
      const pixels = [];
      const rand = rng(69974);
      const cells = new Float32Array(361);
      for (let i = 0; i < cells.length; i++) cells[i] = rand();
      function noise(u, v) {
        const x = Math.floor(u), y = Math.floor(v);
        const i = (y % 19) * 19 + x % 19;
        const j = ((y + 1) % 19) * 19 + x % 19;
        const sx = ease(u - x), sy = ease(v - y);
        return lerp(lerp(cells[i], cells[i + 1], sx), lerp(cells[j], cells[j + 1], sx), sy);
      }
      const radius = (size - 4) / 2;
      for (let row = 0; row < size; row++) {
        const y = (row + .5 - size / 2) / radius;
        for (let col = 0; col < size; col++) {
          const x = (col + .5 - size / 2) / radius;
          const r2 = x * x + y * y;
          const alpha = clamp((1 - r2) * radius * .51 + .48);
          if (alpha === 0) continue;
          const i = row * size + col;
          const z = Math.sqrt(Math.max(0, 1 - r2));
          const basin = noise(6 + x * 3.2, 6 + y * 3.2);
          const ridge = noise(9 + x * 7.3 + z * .65, 9 + y * 7.4);
          const band = (y * .91 + .10 * Math.sin(x * 3.2 + y * 1.8) + .052 * Math.cos(x * 7 - y * 4.7) + .021 * Math.sin(y * 11 + x * 8)) * 35;
          const engraving = Math.pow(.5 + .5 * Math.cos(TAU * band), 12);
          const dot = Math.max(0, Math.sin(col * 2.33) * Math.cos(row * 2.16));
          nx[i] = x;
          ny[i] = y;
          nz[i] = z;
          texture[i] = .42 * basin + .28 * ridge + .18 * rand() - .23 * engraving - .055 * dot;
          image.data[4 * i + 3] = Math.round(alpha * 255);
          pixels.push(i);
        }
      }
      return { disc, paint, image, pixels, nx, ny, nz, texture };
    }

    const sphere = makeSphere();

    function lightDisc(phase, color) {
      if (Math.abs(lightCache.phase - phase) < .0008 && lightCache.color === color) return;
      lightCache = { phase, color };
      const angle = phase * TAU;
      const sunX = Math.sin(angle), sunZ = -Math.cos(angle);
      const { image, pixels, nx, ny, nz, texture } = sphere;
      const data = image.data;
      const light = color.light, ember = color.ember, shadow = color.shadow;
      const dr = light[0] - ember[0], dg = light[1] - ember[1], db = light[2] - ember[2];
      for (let i = 0; i < pixels.length; i++) {
        const index = pixels[i];
        const j = index * 4;
        const v = texture[index];
        const incidence = Math.max(0, nx[index] * sunX + nz[index] * sunZ);
        const daylight = Math.pow(incidence, .32);
        const lit = .071 + .929 * daylight;
        const tint = clamp(.44 - ny[index] * .42 + .63 * v + .27 * daylight);
        const darkness = .79 + v * .65;
        data[j] = lerp(shadow[0] * darkness, ember[0] + dr * tint, lit);
        data[j + 1] = lerp(shadow[1] * darkness, ember[1] + dg * tint, lit);
        data[j + 2] = lerp(shadow[2] * darkness, ember[2] + db * tint, lit);
      }
      sphere.paint.putImageData(image, 0, 0);
    }

    function drawCross(paint, x, y, size) {
      paint.beginPath();
      paint.moveTo(x - size, y);
      paint.lineTo(x + size, y);
      paint.moveTo(x, y - size);
      paint.lineTo(x, y + size);
      paint.stroke();
    }

    function drawStar(paint, x, y, size) {
      paint.beginPath();
      paint.moveTo(x, y - size);
      paint.quadraticCurveTo(x + size * .14, y - size * .14, x + size * .78, y);
      paint.quadraticCurveTo(x + size * .14, y + size * .14, x, y + size);
      paint.quadraticCurveTo(x - size * .14, y + size * .14, x - size * .78, y);
      paint.quadraticCurveTo(x - size * .14, y - size * .14, x, y - size);
      paint.fill();
    }

    function paintBackdrop() {
      const {w, h, mx, my, mr, shore} = dims;
      const c = live.color;
      const base = sky.createLinearGradient(w * .13, 0, w * .74, h);
      base.addColorStop(0, rgb(c.sky));
      base.addColorStop(.59, rgb(mix(c.sky, c.dusk, .37)));
      base.addColorStop(1, rgb(c.dusk));
      sky.fillStyle = base;
      sky.fillRect(0, 0, w, h);
      const aura = sky.createRadialGradient(mx * .74, my * .64, 0, mx * .74, my * .64, mr * 4.13);
      aura.addColorStop(0, rgb(c.air, .49));
      aura.addColorStop(.41, rgb(c.air, .16));
      aura.addColorStop(1, rgb(c.air, 0));
      sky.fillStyle = aura;
      sky.fillRect(0, 0, w, h);
      const twilight = sky.createLinearGradient(0, shore - h * .17, 0, shore + h * .125);
      twilight.addColorStop(0, rgb(c.air, 0));
      twilight.addColorStop(.60, rgb(c.air, .22));
      twilight.addColorStop(1, rgb(c.air, 0));
      sky.fillStyle = twilight;
      sky.fillRect(0, shore - h * .17, w, h * .295);

      sky.fillStyle = rgb(c.orbit);
      for (const point of stars) {
        sky.globalAlpha = .18 + point.a * .64;
        const size = point.size > .97 ? 2.15 : .55 + point.size * .7;
        sky.fillRect(point.x * w, .07 * h + point.y * shore * .83, size, size);
      }
      sky.globalAlpha = .91;
      drawStar(sky, w * .255, h * .221, Math.min(12, w * .021));
      sky.globalAlpha = .75;
      drawStar(sky, w * .843, h * .324, Math.min(9, w * .022));
      drawStar(sky, w * .150, h * .384, 4.6);
      sky.globalAlpha = 1;
      sky.strokeStyle = rgb(c.orbit, .30);
      sky.lineWidth = .7;
      drawCross(sky, .195 * w, .26 * h, 4.2);
      drawCross(sky, .878 * w, .443 * h, 6);
      drawCross(sky, .307 * w, .474 * h, 5);
      sky.globalAlpha = .34;
      sky.fillStyle = sky.createPattern(grain, "repeat");
      sky.fillRect(0, 0, w, h);
      sky.globalAlpha = 1;

      fieldGradient = ctx.createLinearGradient(0, 0, w, 0);
      fieldGradient.addColorStop(0, rgb(c.sea, .30));
      fieldGradient.addColorStop(.30, rgb(c.sea, .73));
      fieldGradient.addColorStop(.58, rgb(mix(c.sea, c.orbit, .25), .93));
      fieldGradient.addColorStop(.81, rgb(c.sea, .66));
      fieldGradient.addColorStop(1, rgb(c.sea, .30));
      waterShade = ctx.createLinearGradient(0, shore - 7, 0, h);
      waterShade.addColorStop(0, rgb(c.dusk, 0));
      waterShade.addColorStop(.21, rgb(c.dusk, .18));
      waterShade.addColorStop(1, rgb(c.dusk, .58));
      skyDirty = false;
    }

    function plotOrbit(time) {
      const c = live.color;
      const { w, mx, my, mr } = dims;
      const radius = mr * 1.235;
      ctx.lineWidth = .8;
      ctx.strokeStyle = rgb(c.orbit, .35);
      ctx.beginPath();
      ctx.arc(mx, my, radius, 0, TAU);
      ctx.stroke();
      ctx.strokeStyle = rgb(c.orbit, .27);
      ctx.setLineDash([1, 4]);
      ctx.beginPath();
      ctx.arc(mx, my, mr * 1.33, -.4, 4.4);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeStyle = rgb(c.orbit, .68);
      for (let i = 0; i < 4; i++) {
        const a = i * Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(mx + Math.cos(a) * radius, my + Math.sin(a) * radius);
        ctx.lineTo(mx + Math.cos(a) * (radius + 10), my + Math.sin(a) * (radius + 10));
        ctx.stroke();
      }
      ctx.strokeStyle = rgb(c.light, .68);
      ctx.lineWidth = 1.2;
      for (const start of [2.91, 5.23]) {
        ctx.beginPath();
        ctx.arc(mx, my, radius, start, start + .70);
        ctx.stroke();
      }
      ctx.save();
      ctx.translate(mx, my);
      ctx.rotate(-.15);
      ctx.strokeStyle = rgb(c.orbit, .22);
      ctx.lineWidth = .8;
      ctx.beginPath();
      ctx.ellipse(0, 0, Math.min(mr * 1.98, w * .535), mr * .40, 0, 0, TAU);
      ctx.stroke();
      ctx.restore();
      const bearing = live.phase * TAU - Math.PI / 2;
      const bx = mx + Math.cos(bearing) * radius;
      const by = my + Math.sin(bearing) * radius;
      ctx.strokeStyle = rgb(c.light, .46);
      ctx.beginPath();
      ctx.arc(bx, by, 8 + Math.sin(time * 1.35) * .9, 0, TAU);
      ctx.stroke();
      ctx.fillStyle = rgb(c.light, .96);
      ctx.beginPath();
      ctx.arc(bx, by, 3.15, 0, TAU);
      ctx.fill();
    }

    function currentPulse(ripple) {
      const t = media.matches && !live.motion ? .49 : live.effectTime - ripple.born;
      const scale = Math.min(dims.w, dims.h);
      return { ...ripple, radius: scale * (.015 + t * .239), power: (1 - t / 1.65) * ripple.power, t };
    }

    function paintSea() {
      const {w, h, mx, shore} = dims;
      const c = live.color;
      const time = live.motionTime;
      const bright = .5 - .5 * Math.cos(live.phase * TAU);
      const tide = .5 + .5 * Math.cos(live.phase * TAU * 2);
      const rows = Math.round(clamp(w / 15, 40, 69));
      const values = dims.waveProfile;
      const samples = values.length - 1;
      const pulses = live.ripples.map(currentPulse);
      const step = w / samples;
      const horizon = shore - (tide - .5) * h * .023;
      ctx.fillStyle = waterShade;
      ctx.fillRect(0, shore - 7, w, h - shore + 7);
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      const band = ctx.createLinearGradient(0, 0, w, 0);
      const lightCenter = mx / w + .018;
      band.addColorStop(0, rgb(c.reflection, 0));
      band.addColorStop(Math.max(0, lightCenter - .21), rgb(c.reflection, 0));
      band.addColorStop(Math.max(0, lightCenter - .085), rgb(c.reflection, .30));
      band.addColorStop(lightCenter, rgb(c.reflection, .95));
      band.addColorStop(Math.min(1, lightCenter + .07), rgb(c.reflection, .40));
      band.addColorStop(Math.min(1, lightCenter + .22), rgb(c.reflection, 0));
      band.addColorStop(1, rgb(c.reflection, 0));

      for (let row = 0; row <= rows; row++) {
        const normalized = row / rows;
        const depth = Math.pow(normalized, 1.62);
        const baseY = horizon + depth * h * .50;
        const frequency = lerp(26, 13, depth);
        const energy = h * (.003 + depth * .062) * (.70 + tide * .62);
        const offset = time * (1.04 + depth * .44) + depth * 7.2;
        const drift = row * .113 - time * .82;
        ctx.beginPath();
        for (let j = 0; j <= samples; j++) {
          const x = j * step;
          const u = j / samples;
          const wave = Math.sin(u * frequency + offset) * .50
            + Math.sin(u * 37.5 - drift + .35 * Math.sin(u * 6 + offset)) * .27
            + Math.sin(u * 8.7 + depth * 14.5 + time * .63) * .41
            + Math.cos(u * 75.2 - offset * 1.12) * .062;
          let displacement = 0;
          for (const ripple of pulses) {
            const dx = x - ripple.x;
            const dy = (baseY - ripple.y) * 1.8;
            if (Math.abs(dx) > ripple.radius + 46 || Math.abs(dy) > ripple.radius + 46) continue;
            const ring = Math.hypot(dx, dy) - ripple.radius;
            if (Math.abs(ring) < 46) {
              const weight = 1 - Math.abs(ring) / 46;
              displacement += Math.cos(ring * .16) * weight * weight * ripple.power;
            }
          }
          const y = baseY + energy * wave + (4 + depth * 12) * displacement / (1 + .45 * Math.abs(displacement));
          values[j] = y;
          if (j === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        const accent = .56 + .44 * Math.sin(row * 1.13 + time * .5);
        ctx.lineWidth = .53 + depth * 1.37 + (row % 6 === 0 ? .32 : 0);
        ctx.globalAlpha = .34 + accent * .54 - depth * .05;
        ctx.strokeStyle = fieldGradient;
        ctx.stroke();

        if (row % 2 === 0 && bright > .025) {
          const center = lightCenter + Math.sin(row * .44 + time * 1.1) * (.016 + .048 * depth);
          const width = .033 + depth * .133 + Math.sin(row * 2.1) * .012;
          const from = Math.max(0, Math.floor((center - width) * samples));
          const to = Math.min(samples, Math.ceil((center + width) * samples));
          ctx.beginPath();
          for (let j = from; j <= to; j++) {
            if (j === from) ctx.moveTo(j * step, values[j]);
            else ctx.lineTo(j * step, values[j]);
          }
          ctx.globalAlpha = (.15 + .85 * bright) * (.53 + .46 * accent);
          ctx.strokeStyle = band;
          ctx.lineWidth = .81 + depth * 1.51;
          ctx.stroke();
        }
      }
      ctx.globalAlpha = 1;

      ctx.fillStyle = rgb(c.reflection);
      for (const spark of sparks) {
        const twinkle = Math.sin(time * (1 + spark.a) + spark.k);
        if (twinkle < .46) continue;
        const xx = mx + (spark.x - .5) * w * (.13 + spark.y * .34);
        const yy = horizon + 8 + spark.y * (h - horizon);
        ctx.globalAlpha = (twinkle - .46) * (.18 + .82 * bright);
        ctx.fillRect(xx, yy, 1 + spark.a * (2 + spark.y * 4), .6 + spark.y * .66);
      }
      ctx.globalAlpha = 1;
      for (const pulse of pulses) paintPulse(pulse);
    }

    function paintPulse(pulse) {
      const color = live.color;
      const { x, y, radius, power, t } = pulse;
      if (power <= 0) return;
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, dims.shore - 5, dims.w, dims.h - dims.shore + 5);
      ctx.clip();
      for (let ring = 0; ring < 3; ring++) {
        const r = radius - ring * (9 + t * 4);
        if (r < 3) continue;
        ctx.beginPath();
        ctx.ellipse(x, y, r, r * .53, .025, 0, TAU);
        ctx.strokeStyle = rgb(mix(color.reflection, color.light, .39), clamp(power * (.66 - ring * .17)));
        ctx.lineWidth = [.95, 1.45, .62][ring];
        ctx.stroke();
      }
      ctx.fillStyle = rgb(color.light, clamp(power * Math.max(0, .68 - t)));
      drawStar(ctx, x, y, 5 + t * 6);
      ctx.restore();
    }

    function paint() {
      const {w, h, mx, my, mr} = dims;
      const {color, phase, motionTime} = live;
      if (skyDirty) paintBackdrop();
      ctx.drawImage(backdrop, 0, 0, w, h);
      plotOrbit(motionTime);
      const bright = .5 - .5 * Math.cos(phase * TAU);
      const glow = ctx.createRadialGradient(mx, my, mr * .90, mx, my, mr * 1.58);
      glow.addColorStop(0, rgb(color.reflection, .29 * bright));
      glow.addColorStop(.42, rgb(color.reflection, .10 * bright));
      glow.addColorStop(1, rgb(color.reflection, 0));
      ctx.fillStyle = glow;
      ctx.fillRect(mx - mr * 1.6, my - mr * 1.6, mr * 3.2, mr * 3.2);
      lightDisc(phase, color);
      ctx.drawImage(sphere.disc, mx - mr, my - mr, mr * 2, mr * 2);
      ctx.beginPath();
      ctx.arc(mx, my, mr * .99, 0, TAU);
      ctx.lineWidth = .75;
      ctx.strokeStyle = rgb(color.light, .16 + .19 * bright);
      ctx.stroke();
      paintSea();
    }

    function phaseName(position) {
      const quarters = position * 4;
      const near = Math.round(quarters);
      return Math.abs(quarters - near) < .025 ? (near * 2) % 8 : Math.floor(quarters) * 2 + 1;
    }

    function readPhase() {
      const position = live.phase;
      const index = phaseName(position);
      const name = phases[index];
      const lighting = Math.round(50 - 50 * Math.cos(position * TAU));
      const age = (position * DAY_COUNT).toFixed(1);
