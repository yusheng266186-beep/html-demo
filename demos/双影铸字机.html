<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15131b">
  <meta name="description" content="用两个字铸造一件字雕。两束光会从同一件字雕中投出不同的字。">
  <title>双影铸字机 · Duplex</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='7' fill='%2315131b'/%3E%3Cpath d='m5 11 14-5v23L5 34Z' fill='%23b8ffc8'/%3E%3Cpath d='m21 6 14 5v23l-14-5Z' fill='%23d8baff'/%3E%3Ccircle cx='20' cy='20' r='4' fill='%2315131b' stroke='%23f3e7f2'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      --black: #15131b;
      --well: #13111a;
      --white: #f5edf0;
      --secondary: #beb3c6;
      --line: #75668070;
      --mint: #b7ffca;
      --violet: #debaff;
      --accent: #f6e8a6;
      --gutter: clamp(17px, 4.7vw, 90px);
      --sans: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --display: "Duplex Han", var(--sans);
      --roman: "Duplex Grotesk", Arial, sans-serif;
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      background:
        radial-gradient(ellipse at 80% 0%, #271c34 0, transparent 51%),
        linear-gradient(122deg, #15131b, #16131f 70%, #1d161f);
      color: var(--white);
    }
    input, button { font: inherit; }
    button { color: inherit; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .62; }
    h1, h2, p { margin: 0; }
    button, input { -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 2px solid #fff1b9; outline-offset: 4px; }
    ::selection { background: var(--mint); color: var(--black); }
    .rail { width: min(calc(100% - 2 * var(--gutter)), 1440px); margin-inline: auto; }
    .symbols { position: absolute; width: 0; height: 0; overflow: hidden; }
    .icon { flex: none; width: 18px; height: 18px; vertical-align: middle; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      gap: 12px;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font: 700 clamp(16px, 1.65vw, 25px)/1 var(--roman);
      letter-spacing: .09em;
      white-space: nowrap;
    }
    .brand .icon { width: 31px; height: 31px; }
    .utilities { display: flex; align-items: center; gap: 7px; }
    .small-button, .mix-button, .furnace {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      min-height: 37px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: #221c2b84;
      color: var(--white);
      font-size: 12px;
      font-weight: 630;
      letter-spacing: .05em;
      white-space: nowrap;
      transition: color 170ms, background-color 170ms, border-color 170ms, transform 170ms;
    }
    .small-button:hover, .mix-button:hover { background: #44364ebc; border-color: #d4bfe0aa; }
    .small-button:active, .mix-button:active, .furnace:active { transform: translateY(1px); }
    .small-button .icon, .mix-button .icon { width: 16px; height: 16px; }
    .small-button[aria-pressed="true"] { background: #f6e8a6; border-color: #f6e8a6; color: #2d241b; }

    .intro {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 21px;
      padding-block: 20px 22px;
    }
    .intro h1 {
      width: fit-content;
      margin-left: -.063em;
      font: 900 clamp(43px, 5.7vw, 82px)/1.02 var(--display);
      letter-spacing: -.063em;
      white-space: nowrap;
      color: #f4eaf5;
    }
    .intro h1 span { color: var(--mint); }
    .intro-copy {
      padding: 0 16px 4px 18px;
      border-left: 1px solid #c5a7ce77;
      color: var(--secondary);
      font-size: clamp(11px, 1.02vw, 15px);
      font-weight: 520;
      letter-spacing: .085em;
      line-height: 1.66;
    }
    .intro-copy strong { color: var(--white); font-weight: 690; }

    .stage {
      position: relative;
      isolation: isolate;
      height: clamp(410px, calc(100svh - 326px), 769px);
      overflow: hidden;
      border: 1px solid #7b658667;
      border-radius: 3px;
      background:
        radial-gradient(ellipse at 51% 61%, #393149 0, #1f1b2b 47%, #0c0b12 100%);
      box-shadow: 0 20px 50px -32px #09070baa;
    }
    .plot {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    .plot.is-turning { cursor: grabbing; }
    .plot:focus-visible { outline-offset: -5px; }
    .frame-corners {
      position: absolute;
      z-index: 1;
      inset: 14px;
      color: #dccadeaf;
      opacity: .67;
      pointer-events: none;
      background:
        linear-gradient(currentColor,currentColor) left top / 10px 1px,
        linear-gradient(currentColor,currentColor) left top / 1px 10px,
        linear-gradient(currentColor,currentColor) right top / 10px 1px,
        linear-gradient(currentColor,currentColor) right top / 1px 10px,
        linear-gradient(currentColor,currentColor) left bottom / 10px 1px,
        linear-gradient(currentColor,currentColor) left bottom / 1px 10px,
        linear-gradient(currentColor,currentColor) right bottom / 10px 1px,
        linear-gradient(currentColor,currentColor) right bottom / 1px 10px;
      background-repeat: no-repeat;
    }
    .stage-bar {
      position: absolute;
      z-index: 2;
      top: clamp(21px, 2.7vw, 37px);
      left: clamp(23px, 3.1vw, 43px);
      right: clamp(23px, 3.1vw, 43px);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      pointer-events: none;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 28px;
      padding: 3px 9px;
      border: 1px solid #bdaacc56;
      border-radius: 2px;
      background: #181322c9;
      color: #eee2f0;
      font-size: 10px;
      font-weight: 650;
      letter-spacing: .1em;
    }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 10px #b7ffca81; }
    .status[data-mode="turned"]::before { background: var(--violet); box-shadow: 0 0 10px #debaff80; }
    .status[data-mode="casting"]::before, .status[data-mode="aligning"]::before { background: var(--accent); box-shadow: 0 0 10px #f6e8a690; }
    .status[data-mode="casting"], .status[data-mode="aligning"] { border-color: #d3bb7770; }
    .stage-bar .small-button { pointer-events: auto; background: #181322df; }
    .stage-bar .small-button:hover { background: #493957e8; }
    .stage-bar .small-button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #2d241b; }
    .axis-key {
      position: absolute;
      z-index: 2;
      bottom: clamp(24px, 2.7vw, 38px);
      left: clamp(23px, 3.1vw, 43px);
      display: flex;
      align-items: center;
      gap: 13px;
      color: #e1d5e9cc;
      font: 600 11px/1 var(--roman);
      letter-spacing: .10em;
      pointer-events: none;
    }
    .axis-key span { display: inline-flex; align-items: center; gap: 6px; }
    .axis-key i { width: 12px; height: 2px; background: var(--mint); }
    .axis-key span:last-child i { background: var(--violet); }
    .frame-hint {
      position: absolute;
      right: clamp(23px, 3.1vw, 43px);
      bottom: clamp(19px, 2.25vw, 32px);
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #e5d5ebc4;
      font-size: 10px;
      letter-spacing: .12em;
      pointer-events: none;
    }
    .frame-hint .icon { width: 16px; height: 16px; }
    .stage-message { position: absolute; inset: 47% 10% auto; color: #eadff0; font-size: 14px; text-align: center; }

    .form {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: clamp(9px, 1.5vw, 20px);
      align-items: stretch;
      margin-top: 13px;
    }
    .face { --beam: var(--mint); --tint: #20322c; }
    .face.second { --beam: var(--violet); --tint: #342840; }
    .face {
      position: relative;
      display: grid;
      grid-template-columns: auto minmax(53px,1fr) auto;
      align-items: center;
      gap: clamp(7px, 1.1vw, 16px);
      min-width: 0;
      min-height: 69px;
      padding: 8px 12px;
      border: 1px solid color-mix(in srgb, var(--beam) 43%, #2b2435);
      border-radius: 3px;
      background: linear-gradient(108deg,var(--tint),#221a2aaf);
      cursor: text;
    }
    .face:focus-within { border-color: var(--beam); }
    .face-code {
      display: grid;
      justify-items: start;
      gap: 5px;
      min-width: 43px;
      color: var(--beam);
      white-space: nowrap;
    }
    .face-code b { font: 700 18px/1 var(--roman); letter-spacing: .08em; }
    .face-code small { color: #e5d9e8; font-size: 9px; font-weight: 610; letter-spacing: .13em; }
    .glyph {
      display: block;
      min-width: 0;
      width: 100%;
      height: 53px;
      padding: 0 9px;
      border: 1px solid #e8ffe923;
      border-radius: 2px;
      color: var(--beam);
      background: #100e17a8;
      font: 900 32px/1 var(--display);
      text-align: center;
      transition: border-color 150ms;
    }
    .glyph:focus-visible { outline: none; border-color: var(--beam); }
    .glyph[aria-invalid="true"] { border-color: #ffc0aa; }
    .glyph::placeholder { color: #d1bad285; font: 600 12px/1 var(--sans); }
    .proof {
      display: block;
      width: 43px;
      height: 43px;
      border: 1px solid #ffffff21;
      border-radius: 2px;
      background: var(--beam);
      color: #231730;
    }
    .command {
      display: flex;
      align-items: stretch;
      gap: 7px;
    }
    .furnace {
      gap: 9px;
      min-width: 117px;
      padding-inline: clamp(12px,2vw,28px);
      color: #251b2a;
      background: var(--accent);
      border-color: var(--accent);
      font-size: 15px;
      font-weight: 810;
    }
    .furnace:hover { background: #fff0b8; border-color: #fff0b8; }
    .furnace .icon { width: 19px; height: 19px; }
    .command .mix-button { width: 49px; padding: 0; }
    .presets {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      flex-wrap: wrap;
      gap: 7px;
      min-height: 48px;
      padding-block: 7px 8px;
    }
    .presets > span {
      margin-right: 5px;
      color: #c3b5cc;
      font-size: 10px;
      font-weight: 590;
      letter-spacing: .075em;
      white-space: nowrap;
    }
    .preset {
      min-height: 27px;
      padding: 0 8px;
      border: 1px solid #82708e80;
      border-radius: 2px;
      background: #251c2d55;
      color: #e5d8ec;
      font-size: 10px;
      letter-spacing: .07em;
      transition: color 150ms, background-color 150ms, border-color 150ms;
    }
    .preset:hover { color: var(--white); background: #58436388; border-color: #b295bd; }
    .preset[aria-pressed="true"] { border-color: #d6c1b990; color: var(--accent); background: #67574844; }
    .toast {
      position: fixed;
      z-index: 5;
      right: max(var(--gutter), env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom));
      width: max-content;
      max-width: min(41ch, calc(100vw - 37px));
      padding: 10px 13px;
      border: 1px solid #a98aae;
      border-radius: 2px;
      background: #342339;
      box-shadow: 0 7px 24px #0b0711ba;
      color: #fff1fb;
      font-size: 12px;
      font-weight: 590;
    }
    .toast:empty { display: none; }
    dialog {
      width: min(515px, calc(100vw - 39px));
      padding: clamp(21px, 4vw, 35px);
      border: 1px solid #987aa7;
      border-radius: 3px;
      background: #22192c;
      color: var(--white);
      box-shadow: 0 19px 64px #0b0710c9;
    }
    dialog::backdrop { background: #100c16c9; }
    .help-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .help-head h2 { color: var(--mint); font-size: 24px; }
    .help-head .small-button { padding: 0 9px; }
    .help-copy { display: grid; gap: 12px; margin-top: 16px; color: #f2e5f2; }
    .help-copy p { font-size: 13px; line-height: 1.72; }
    .help-copy kbd { font: 700 13px/1 var(--roman); color: var(--accent); }

    @media (max-width: 880px) {
      .intro { padding-block: 17px 18px; }
      .stage { height: clamp(385px, calc(100svh - 276px), 644px); }
      .form { gap: 8px; margin-top: 9px; }
      .face { gap: 7px; padding-inline: 8px; }
      .face-code { min-width: 36px; }
      .proof { width: 36px; height: 36px; }
      .furnace { min-width: 94px; }
    }
    @media (max-width: 635px) {
      .masthead { min-height: 53px; }
      .brand { font-size: 15px; gap: 6px; }
      .brand .icon { width: 25px; height: 25px; }
      .utilities { gap: 4px; }
      .utilities .small-button { width: 40px; min-height: 37px; padding: 0; }
      .utilities .small-button span { display: none; }
      .intro { grid-template-columns: 1fr; gap: 9px; padding-block: 16px 13px; }
      .intro h1 { font-size: clamp(39px, 9.5vw, 58px); }
      .intro-copy { padding: 0; border: 0; font-size: 11px; line-height: 1.5; }
      .intro-copy br { display: none; }
      .stage { height: clamp(319px, 46svh, 494px); }
      .stage-bar { top: 14px; left: 15px; right: 15px; }
      .stage-bar .small-button { min-height: 34px; padding-inline: 6px; gap: 5px; font-size: 10px; }
      .stage-bar .small-button .icon { width: 14px; height: 14px; }
      .status { font-size: 9px; padding-inline: 6px; min-height: 24px; }
      .frame-corners { inset: 8px; }
      .axis-key { left: 15px; bottom: 16px; font-size: 10px; gap: 9px; }
      .frame-hint { right: 15px; bottom: 13px; font-size: 9px; gap: 4px; }
      .form { grid-template-columns: 1fr 1fr; gap: 7px; }
      .command { grid-column: span 2; display: grid; grid-template-columns: 1fr 53px; gap: 7px; min-height: 43px; }
      .command .mix-button { width: auto; }
      .furnace { font-size: 14px; }
      .face { min-height: 58px; grid-template-columns: auto minmax(40px,1fr) auto; gap: 6px; padding: 6px; }
      .face-code { min-width: 28px; gap: 3px; }
      .face-code b { font-size: 15px; }
      .face-code small { font-size: 8px; letter-spacing: .05em; }
      .glyph { height: 45px; font-size: 27px; padding-inline: 2px; }
      .proof { width: 26px; height: 26px; }
      .presets { min-height: 44px; padding-block: 7px; }
      .preset { min-height: 29px; }
    }
    @media (max-width: 355px) {
      :root { --gutter: 13px; }
      .intro-copy { letter-spacing: .006em; }
      .status { letter-spacing: .035em; }
      .stage-bar .small-button { padding-inline: 5px; }
      .proof { width: 23px; height: 23px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0s !important; }
    }

  <header class="masthead rail">
    <div class="brand" lang="en"><svg class="icon" aria-hidden="true"><use href="#duplex-logo"/></svg>DUPLEX</div>
    <div class="utilities" role="group" aria-label="铸字机工具">
      <button class="small-button" id="help-toggle" type="button" aria-label="查看投影原理" title="查看投影原理">
        <svg class="icon" aria-hidden="true"><use href="#question"/></svg><span>原理</span>
      </button>
      <button class="small-button" id="capture" type="button" aria-label="保存投影画面" title="保存投影画面">
        <svg class="icon" aria-hidden="true"><use href="#photo"/></svg><span>留影</span>
      </button>
    </div>
  </header>

  <main class="rail">
    <header class="intro">
      <h1>双<span>影</span>铸字机</h1>
      <p class="intro-copy"><strong>一件字雕，两面影子。</strong><br>输入两个字，让它们共用一个形体。</p>
    </header>

    <section class="stage" id="stage" aria-label="双向投影舞台">
      <canvas class="plot" id="plot" tabindex="0" role="img" aria-label="一件字雕在两块屏幕上投下不同的字。拖动或用方向键旋转字雕。"></canvas>
      <div class="frame-corners" aria-hidden="true"></div>
      <div class="stage-bar">
        <span id="status" class="status" data-mode="aligned" role="status">已对准光轴</span>
        <div>
          <button class="small-button" id="rays" type="button" aria-pressed="false" title="显示两束光的方向">
            <svg class="icon" aria-hidden="true"><use href="#ray-icon"/></svg>光路
          </button>
          <button class="small-button" id="home" type="button" title="让字雕重新对准光轴">
            <svg class="icon" aria-hidden="true"><use href="#crosshair"/></svg>对准
          </button>
        </div>
      </div>
      <div class="axis-key" aria-hidden="true"><span><i></i>A</span><span><i></i>B</span></div>
      <span class="frame-hint"><svg class="icon" aria-hidden="true"><use href="#rotate"/></svg>拖动旋转</span>
      <noscript><p class="stage-message">启用 JavaScript 即可铸造和投影。</p></noscript>
    </section>

    <form class="form" id="foundry" novalidate>
      <label class="face">
        <span class="face-code" aria-hidden="true"><b>A</b><small>第一面</small></span>
        <input class="glyph" id="glyph-a" aria-label="第一面的字" aria-describedby="glyph-instruction" type="text" value="梦" placeholder="输入一字" autocomplete="off" autocapitalize="off" spellcheck="false">
        <canvas class="proof" id="proof-a" width="216" height="216" aria-hidden="true"></canvas>
      </label>
      <label class="face second">
        <span class="face-code" aria-hidden="true"><b>B</b><small>第二面</small></span>
        <input class="glyph" id="glyph-b" aria-label="第二面的字" aria-describedby="glyph-instruction" type="text" value="醒" placeholder="输入一字" autocomplete="off" autocapitalize="off" spellcheck="false">
        <canvas class="proof" id="proof-b" width="216" height="216" aria-hidden="true"></canvas>
      </label>
      <span id="glyph-instruction" class="sr-only">每面可输入一个汉字、字母或符号。</span>
      <div class="command">
        <button class="furnace" id="cast" type="submit"><svg class="icon" aria-hidden="true"><use href="#cube"/></svg><span>铸造</span></button>
        <button class="mix-button" id="mix" type="button" aria-label="随机选一对字" title="随机选一对字"><svg class="icon" aria-hidden="true"><use href="#shuffle-icon"/></svg></button>
      </div>
    </form>
    <div class="presets" id="presets" role="group" aria-label="示例字对">
      <span>试一对字</span>
      <button class="preset" type="button" data-pair="梦醒" aria-pressed="true">梦 / 醒</button>
      <button class="preset" type="button" data-pair="昼夜" aria-pressed="false">昼 / 夜</button>
      <button class="preset" type="button" data-pair="山火" aria-pressed="false">山 / 火</button>
      <button class="preset" type="button" data-pair="你我" aria-pressed="false">你 / 我</button>
      <button class="preset" type="button" data-pair="AB" aria-pressed="false">A / B</button>
    </div>
  </main>

  <dialog id="help" aria-labelledby="help-title">
    <form method="dialog">
      <div class="help-head"><h2 id="help-title">两个影子从哪里来</h2><button class="small-button" aria-label="关闭原理"><svg class="icon" aria-hidden="true"><use href="#close-icon"/></svg></button></div>
    </form>
    <div class="help-copy">
      <p>铸字机把两个字切成许多水平层。每一层只在两边笔画相交的位置保留小方块。两束互相垂直的平行光照向字雕，就会分别投出两个字。</p>
      <p>字符的某一层完全留白时，展示用的细支撑线可能出现在字旁。</p>
      <p>拖动舞台旋转字雕。用 Tab 聚焦舞台后，也可按 <kbd>← ↑ ↓ →</kbd> 转动，或按 <kbd>Home</kbd> 对准光轴。</p>
    </div>
  </dialog>
  <p class="toast" id="toast" role="status"></p>
