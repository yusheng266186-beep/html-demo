<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eee9dc">
  <meta name="description" content="一间可亲手抛掷藏品、旋转重力和倒带碰撞的虚构展厅。">
  <title>失重收藏室 · Objects in Limbo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%23a32e1f'/%3E%3Cpath d='M9 24 15 8l14 6-6 16Z' fill='none' stroke='%23fff0d5' stroke-width='2'/%3E%3Cpath d='m14 29 6-16 14 6-6 16Z' fill='%23fff0d5' fill-opacity='.70'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --paper: #eee9dc;
      --ink: #29231e;
      --muted: #645750;
      --line: #77635854;
      --cream: #fff1d8;
      --accent: #a62c20;
      --rail: clamp(18px, 5vw, 88px);
      --display: "Limbo Han", "Songti SC", "Noto Serif CJK SC", SimSun, serif;
      --sans: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --label: "Limbo Grotesk", var(--sans);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); }
    h1, h2, p { margin: 0; }
    button { font: inherit; cursor: pointer; }
    button { -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 2px solid #a52f24; outline-offset: 4px; }
    ::selection { color: var(--ink); background: #e8b08e; }
    .symbols { position: absolute; width: 0; height: 0; overflow: hidden; }
    .icon { flex: none; width: 19px; height: 19px; vertical-align: middle; }
    .shell { width: min(calc(100% - 2 * var(--rail)), 1500px); margin-inline: auto; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .topline {
      min-height: 64px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
    }
    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      font: 700 clamp(12px, 1.22vw, 18px)/1.05 var(--label);
      letter-spacing: .15em;
      white-space: nowrap;
    }
    .wordmark .icon { width: 29px; height: 29px; color: var(--accent); }
    .head-tools { display: flex; align-items: center; gap: 8px; }
    .head-button, .control-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 37px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: transparent;
      color: var(--ink);
      white-space: nowrap;
      font-size: 11px;
      font-weight: 640;
      letter-spacing: .06em;
      transition: color 150ms, border-color 150ms, background-color 150ms, transform 150ms;
    }
    .head-button:hover, .control-button:hover { border-color: var(--ink); background: #fffc; }
    .head-button:active, .control-button:active { transform: translateY(1px); }
    .head-button .icon { width: 16px; height: 16px; }
    .head-button[aria-pressed="true"] { color: #fff4dd; background: var(--accent); border-color: var(--accent); }
    .sound-on, #sound[aria-pressed="true"] .sound-off { display: none; }
    #sound[aria-pressed="true"] .sound-on { display: inline-block; }
    .head-button:disabled { opacity: .6; cursor: wait; }

    .gallery {
      position: relative;
      isolation: isolate;
      height: clamp(515px, calc(100svh - 171px), 1050px);
      overflow: hidden;
      background: #ab3625;
      color: var(--cream);
      border-block: 1px solid #762316;
    }
    .room, .wash, .ghostlight, .light-flash, .shadow-canvas, .objects { position: absolute; inset: 0; }
    .room { width: 100%; height: 100%; object-fit: cover; object-position: center center; }
    .wash {
      pointer-events: none;
      background:
        linear-gradient(90deg, #2c08063b 0%, transparent 57%),
        linear-gradient(0deg, #2707066e 0%, transparent 31%);
    }
    .ghostlight {
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(ellipse at 58% 50%, transparent 36%, #17245473 96%), #9ac4e229;
      mix-blend-mode: screen;
      transition: opacity 240ms;
    }
    .gallery.is-rewinding .ghostlight { opacity: 1; }
    .light-flash { z-index: 6; background: #fff2d3; pointer-events: none; opacity: 0; }
    .light-flash.is-flashing { animation: expose 450ms ease-out; }
    @keyframes expose { 0% { opacity: 0; } 14% { opacity: .67; } 100% { opacity: 0; } }
    .shadow-canvas { width: 100%; height: 100%; pointer-events: none; }
    .gallery-heading {
      position: absolute;
      z-index: 1;
      left: max(var(--rail), calc((100% - 1500px) / 2));
      top: clamp(47px, 10.6%, 123px);
      pointer-events: none;
    }
    .gallery-heading h1 {
      width: max-content;
      margin-left: -.065em;
      color: #fff4dc;
      font: 900 clamp(66px, 8vw, 138px)/.95 var(--display);
      letter-spacing: -.038em;
      text-shadow: 0 2px 14px #3d0d075e;
    }
    .gallery-heading h1 span { display: block; }
    .gallery-heading h1 span + span { margin-top: .075em; }
    .gallery-heading p {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-top: clamp(20px, 3.3vh, 37px);
      color: #ffebcf;
      font-size: clamp(12px, 1.13vw, 16px);
      line-height: 1.5;
      font-weight: 560;
      letter-spacing: .09em;
      text-shadow: 0 1px 8px #4e120b8c;
    }
    .gallery-heading p::before { content: ""; width: 29px; height: 1px; background: #ffe5b6b8; }
    .mode-mark {
      position: absolute;
      z-index: 4;
      top: clamp(22px, 4.25vw, 58px);
      right: max(var(--rail), calc((100% - 1500px) / 2));
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 26px;
      padding: 3px 9px 3px 8px;
      border: 1px solid #ffe8c86a;
      border-radius: 2px;
      background: #3d070642;
      color: #fff1d8;
      font-size: 10px;
      font-weight: 620;
      letter-spacing: .13em;
      white-space: nowrap;
      pointer-events: none;
    }
    .mode-mark::before { width: 6px; height: 6px; border-radius: 50%; background: #ffdb9c; box-shadow: 0 0 12px #ffd998; content: ""; }
    .gallery.is-rewinding .mode-mark { color: #f4f5fa; background: #151e3e6b; border-color: #ebeeed8c; }
    .gallery.is-rewinding .mode-mark::before { background: #d8eaff; box-shadow: 0 0 12px #bddefe; }

    .objects { z-index: 2; pointer-events: none; }
    .artifact {
      position: absolute;
      top: 0;
      left: 0;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 3px;
      background: transparent;
      color: var(--cream);
      cursor: grab;
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      will-change: transform;
    }
    .artifact:focus-visible { outline: 1px dashed #fff4d7; outline-offset: 6px; }
    .artifact.is-held { cursor: grabbing; z-index: 5; }
    .artifact img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      -webkit-user-drag: none;
      user-select: none;
      filter: drop-shadow(10px 15px 12px #3b090866);
      rotate: var(--turn, 0rad);
      scale: 1;
      transition: scale 220ms cubic-bezier(.2,.7,.24,1), filter 190ms;
    }
    .artifact:hover img, .artifact.is-held img {
      scale: 1.033;
      filter: drop-shadow(10px 16px 16px #2d04066e);
    }
    .pin {
      position: absolute;
      top: -2px;
      right: -9px;
      display: grid;
      place-items: center;
      width: 25px;
      height: 25px;
      border: 1px solid #fff2d59e;
      border-radius: 50%;
      background: #622018c7;
      color: #fff0d2;
      text-align: center;
      font: 600 9px/1 var(--label);
      letter-spacing: .035em;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 190ms, transform 190ms;
      pointer-events: none;
    }
    .artifact.is-picked .pin, .artifact:hover .pin, .artifact:focus-visible .pin { opacity: 1; transform: none; }
    .placard {
      position: absolute;
      z-index: 4;
      left: max(var(--rail), calc((100% - 1500px) / 2));
      bottom: clamp(21px, 4.8vh, 50px);
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 13px;
      max-width: min(470px, 92%);
      padding-top: 10px;
      border-top: 1px solid #ffe7c47a;
      pointer-events: none;
      text-shadow: 0 2px 12px #33090485;
    }
    .placard-no {
      min-width: 25px;
      padding-top: 6px;
      color: #ffd9b6;
      font: 600 11px/1 var(--label);
      letter-spacing: .13em;
    }
    .placard h2 { color: #fff4df; font-size: clamp(17px, 1.88vw, 28px); font-weight: 640; letter-spacing: .11em; }
    .placard p { margin-top: 5px; color: #ffe3c7; font-size: clamp(11px, .95vw, 14px); line-height: 1.6; letter-spacing: .045em; }
    .rewind-lines {
      position: absolute;
      z-index: 3;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      background: repeating-linear-gradient(0deg,#fff0 0 6px,#faeeff26 6px 7px);
      mask-image: linear-gradient(90deg, black, transparent 36%, transparent 70%, black);
      transition: opacity 180ms;
    }
    .gallery.is-rewinding .rewind-lines { opacity: .55; }

    .controls {
      display: grid;
      grid-template-columns: fit-content(236px) auto minmax(190px, 1fr) auto;
      align-items: center;
      gap: clamp(16px, 3.5vw, 57px);
      min-height: 106px;
      padding-block: 13px;
    }
    .field {
      display: flex;
      align-items: center;
      gap: 15px;
      white-space: nowrap;
    }
    .compass {
      --angle: 90deg;
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      width: 63px;
      height: 63px;
      border: 1px solid #857369;
      border-radius: 50%;
      background: #fbf6eb;
      color: var(--ink);
      cursor: crosshair;
      touch-action: none;
    }
    .compass::before {
      position: absolute;
      inset: 4px;
      z-index: -1;
      border-radius: 50%;
      background: repeating-conic-gradient(#6c594e 0deg 1.3deg, transparent 1.3deg 22.5deg);
      mask-image: radial-gradient(transparent 60%, black 62%);
      content: "";
    }
    .compass::after, .compass .needle { pointer-events: none; }
    .compass .needle { width: 34px; height: 34px; color: var(--accent); transform: rotate(var(--angle)); }
    .compass.is-inactive .needle { color: #85584e; }
    .measure { display: grid; gap: 3px; }
    .control-label { color: var(--muted); font-size: 10px; font-weight: 610; letter-spacing: .13em; }
    .field-value { font: 630 17px/1.2 var(--label); letter-spacing: .035em; }
    .field-actions { display: flex; align-items: center; gap: 7px; }
    .control-button { height: 44px; min-height: 44px; }
    .control-button .icon { width: 17px; height: 17px; }
    .control-button[aria-pressed="true"] { border-color: #9f3023; background: #f3d7c4; color: #792216; }
    .rewind-tool {
      display: grid;
      grid-template-columns: auto minmax(88px, 1fr);
      align-items: center;
      gap: clamp(11px, 1.8vw, 26px);
      min-width: 0;
      padding-inline: clamp(10px, 2vw, 29px) 0;
      border-left: 1px solid var(--line);
    }
    .rewind-button {
      position: relative;
      min-width: 105px;
      background: var(--ink);
      color: #fbecd4;
      border-color: var(--ink);
      touch-action: none;
      user-select: none;
    }
    .rewind-button:hover { background: #463630; color: #fff2cf; }
    .rewind-button[data-holding="true"] { color: #fff1d8; background: var(--accent); border-color: var(--accent); }
    .rewind-button[data-holding="true"] .icon { transform: scale(.9) translateX(-2px); }
    .history-axis { display: grid; gap: 6px; align-items: center; min-width: 0; }
    .history-labels {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      white-space: nowrap;
      font-size: 10px;
      font-weight: 590;
      letter-spacing: .08em;
    }
    .history-labels output { font: 600 11px/1 var(--label); letter-spacing: .03em; }
    .history-track {
      --memory: 0%;
      position: relative;
      height: 6px;
      overflow: hidden;
      border: 1px solid #7967594f;
      background: repeating-linear-gradient(90deg, #83746758 0 1px, #fff0 1px 12.5%);
    }
    .history-track::before { position: absolute; inset: 0 auto 0 0; width: var(--memory); background: var(--accent); content: ""; }
    .reset-button { justify-self: end; }
    .toast {
      position: fixed;
      z-index: 8;
      right: max(var(--rail), env(safe-area-inset-right));
      bottom: max(17px, env(safe-area-inset-bottom));
      max-width: min(37ch, calc(100vw - 36px));
      border: 1px solid #786858;
      background: #2f2420;
      color: #fff1d5;
      font-size: 12px;
      letter-spacing: .04em;
      padding: 11px 14px;
      box-shadow: 0 4px 17px #3116124d;
    }
    .toast:empty { display: none; }
    .static-note { position: absolute; right: var(--rail); bottom: 19px; z-index: 6; color: #ffecc9; }
    dialog {
      width: min(500px, calc(100vw - 37px));
      padding: clamp(19px, 3.7vw, 36px);
      border: 1px solid #6d4a3e;
      border-radius: 2px;
      color: var(--ink);
      background: #f6efe0;
      box-shadow: 0 17px 75px #2d030377;
    }
    dialog::backdrop { background: #2e0c0abd; }
    .help-head { display: flex; align-items: center; justify-content: space-between; gap: 22px; }
    .help-head h2 { font: 800 29px/1.12 var(--display); letter-spacing: .03em; }
    .help-head .head-button { padding: 0 9px; width: 38px; }
    .help-list { margin: 24px 0 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px 15px; align-items: baseline; }
    .help-list dt { color: #8a2e22; font-size: 12px; font-weight: 680; }
    .help-list dd { margin: 0; color: #51423c; font-size: 12px; line-height: 1.55; }
    .help-list kbd { font: 650 12px/1 var(--label); }

    @media (max-width: 1060px) {
      .controls { grid-template-columns: auto auto minmax(158px, 1fr) auto; gap: clamp(12px, 2.4vw, 29px); }
      .gallery-heading h1 { font-size: clamp(62px, 8.4vw, 106px); }
      .field { gap: 10px; }
      .compass { width: 56px; height: 56px; }
      .control-button { padding-inline: 9px; gap: 5px; }
      .rewind-tool { gap: 11px; padding-inline: 12px 0; }
    }
    @media (max-width: 700px) {
      :root { --rail: clamp(16px, 4.5vw, 25px); }
      .topline { min-height: 55px; gap: 7px; }
      .wordmark { font-size: 12px; letter-spacing: .08em; gap: 6px; }
      .wordmark .icon { width: 25px; height: 25px; }
      .head-tools { gap: 5px; }
      .head-button { min-width: 38px; min-height: 37px; padding-inline: 8px; gap: 4px; }
      .head-button span { display: none; }
      .gallery { height: clamp(482px, calc(100svh - 194px), 900px); }
      .room { object-position: 51% 50%; }
      .gallery-heading { top: 34px; }
      .gallery-heading h1 { font-size: clamp(42px, 10.5vw, 74px); line-height: 1.05; letter-spacing: -.042em; }
      .gallery-heading h1 span { display: inline; }
      .gallery-heading h1 span + span { margin: 0; }
      .gallery-heading p { margin-top: 10px; font-size: 11px; gap: 6px; letter-spacing: .065em; }
      .gallery-heading p::before { width: 17px; }
      .mode-mark { top: 9px; min-height: 20px; font-size: 9px; padding-inline: 6px; gap: 5px; }
      .mode-mark::before { width: 5px; height: 5px; }
      .pin { width: 20px; height: 20px; right: -5px; font-size: 8px; }
      .artifact img { filter: drop-shadow(5px 9px 8px #3b090876); }
      .artifact:hover img, .artifact.is-held img { filter: drop-shadow(6px 11px 10px #3b090883); }
      .placard { gap: 8px; max-width: calc(100% - 2 * var(--rail)); bottom: 15px; padding-top: 6px; }
      .placard-no { min-width: 18px; font-size: 9px; padding-top: 5px; }
      .placard h2 { font-size: 18px; letter-spacing: .07em; }
      .placard p { margin-top: 3px; font-size: 10px; }
      .controls {
        min-height: 139px;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 7px 9px;
        padding-block: 10px 12px;
      }
      .field { gap: 9px; }
      .compass { width: 47px; height: 47px; }
      .compass .needle { width: 27px; height: 27px; }
      .field-value { font-size: 15px; }
      .field-actions { justify-self: end; gap: 5px; }
      .control-button { min-height: 38px; height: 38px; font-size: 10px; }
      .control-button .icon { width: 15px; height: 15px; }
      .rewind-tool { padding: 0; border: 0; gap: 7px; grid-template-columns: auto minmax(50px, 1fr); }
      .rewind-button { min-width: 86px; }
      .history-labels { font-size: 8px; gap: 4px; }
      .history-labels output { font-size: 9px; }
      .measure .control-label { font-size: 9px; }
    }
    @media (max-width: 350px) {
      .wordmark { font-size: 10px; }
      .wordmark .icon { width: 21px; height: 21px; }
      .head-button { min-width: 34px; min-height: 34px; padding-inline: 6px; }
      .head-tools { gap: 4px; }
      .control-button { padding-inline: 6px; }
      .history-labels > span { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0s !important; }
      .light-flash.is-flashing { animation: none; }
      .artifact:hover img, .artifact.is-held img { scale: none; }

      angle: Math.PI / 2, targetAngle: Math.PI / 2, force: 0, targetForce: 0,
      t: 0, sum: 0, clock: 0, recording: false, lastSaved: 0, noMotion: 0,
      lastDisplay: "", lastHistory: -1, lastBearing: -1, lastFloat: null
    };
    let past = [];
    let echoes = [];
    let flecks = [];
    let selected = 0;
    let grip = null;
    let turn = null;
    let rewind = null;
    let rehang = null;
    let frame = 0;
    let lastStamp = 0;
    let noticeTimer;
    let recordingSince = 0;
    let audio;
    let soundEnabled = false;

    function notice(message) {
      clearTimeout(noticeTimer);
      $("#toast").textContent = message;
      noticeTimer = setTimeout(() => { $("#toast").textContent = ""; }, 2550);
    }

    function select(index) {
      if (index === selected) return;
      selected = index;
      const item = objects[index];
      for (const thing of objects) {
        const active = thing === item;
        thing.button.classList.toggle("is-picked", active);
        thing.button.setAttribute("aria-pressed", String(active));
      }
      $("#piece-number").textContent = String(index + 1).padStart(2, "0");
      $("#piece-title").textContent = item.name;
      $("#piece-info").textContent = item.info;
    }

    function announceField() {
      const bearing = Math.round(normalized(world.targetAngle) * 360 / TAU) % 360;
      const names = ["向右", "右下", "向下", "左下", "向左", "左上", "向上", "右上"];
      const word = names[Math.round(bearing / 45) % 8];
      if (bearing !== world.lastBearing) {
        world.lastBearing = bearing;
        $("#direction").textContent = word + " " + String(bearing).padStart(3, "0") + "°";
        compass.setAttribute("aria-valuenow", bearing);
        compass.setAttribute("aria-valuetext", word + "，" + bearing + " 度");
      }
      const mode = rewind ? "时间倒带" : world.targetForce > 0 ? "重力开启" : "悬浮中";
      if (mode !== world.lastDisplay) {
        world.lastDisplay = mode;
        $("#mode-mark").textContent = mode;
      }
      const floating = world.targetForce === 0;
      if (world.lastFloat !== floating) {
        world.lastFloat = floating;
        floatButton.setAttribute("aria-pressed", String(floating));
        compass.classList.toggle("is-inactive", floating);
      }
    }

    function showMemory() {
      const frames = Math.max(0, past.length - 1);
      if (world.lastHistory === frames) return;
      world.lastHistory = frames;
      $(".history-track").style.setProperty("--memory", (100 * frames / (MAX_MEMORY - 1)) + "%");
      $("#memory").value = (frames / 30).toFixed(1) + " s";
    }

    function snapshot() {
      past.push({
        angle: world.angle, targetAngle: world.targetAngle, force: world.force, targetForce: world.targetForce, t: world.t,
        pieces: objects.map(item => [
          item.x / wall.w, item.y / wall.h, item.vx / wall.unit, item.vy / wall.unit, item.angle, item.spin, item.anchored
        ])
      });
      if (past.length > MAX_MEMORY) past.shift();
      world.lastSaved = world.t;
    }

    function record() {
      if (world.recording) return;
      world.recording = true;
      world.noMotion = 0;
      recordingSince = world.clock;
      if (!past.length) snapshot();
    }

    function restore(sample) {
      world.angle = sample.angle;
      world.targetAngle = sample.targetAngle;
      world.force = sample.force;
      world.targetForce = sample.targetForce;
      world.t = sample.t;
      world.lastSaved = sample.t;
      objects.forEach((item, index) => {
        const [x, y, u, v, a, spin, hold] = sample.pieces[index];
        item.x = x * wall.w;
        item.y = y * wall.h;
        item.vx = u * wall.unit;
        item.vy = v * wall.unit;
        item.angle = a;
        item.spin = spin;
        item.anchored = hold;
      });
    }

    function bringLoose() {
      for (const item of objects) {
        if (!item.anchored) continue;
        item.anchored = false;
        item.vx = (item.index - 1.8) * 19 * wall.unit;
        item.vy = Math.cos(item.index * 2.2) * 31 * wall.unit;
        item.spin = (item.index % 2 ? -.55 : .53) + .08 * item.index;
      }
    }

    function setField(angle, force) {
      endRewind(false);
      rehang = null;
      record();
      world.targetAngle = normalized(angle);
      world.targetForce = force;
      if (force > 0) bringLoose();
      announceField();
      askFrame();
    }

    floatButton.addEventListener("click", () => setField(world.targetAngle, world.targetForce > 0 ? 0 : 1));
    $("#flip").addEventListener("click", () => setField(world.targetAngle + Math.PI, 1));

    function moveCompass(event) {
      const r = compass.getBoundingClientRect();
      const x = event.clientX - (r.left + r.width / 2), y = event.clientY - (r.top + r.height / 2);
      if (Math.hypot(x, y) < 4) return;
      setField(Math.atan2(y, x), 1);
    }
    compass.addEventListener("pointerdown", event => {
      if (!event.isPrimary || event.button !== 0) return;
      turn = event.pointerId;
      compass.setPointerCapture(event.pointerId);
      compass.focus({ preventScroll: true });
      moveCompass(event);
    });
    compass.addEventListener("pointermove", event => { if (event.pointerId === turn) moveCompass(event); });
    function endTurn(event) { if (event.pointerId === turn) turn = null; }
    compass.addEventListener("pointerup", endTurn);
    compass.addEventListener("lostpointercapture", endTurn);
    compass.addEventListener("keydown", event => {
      let angle;
      switch(event.key) {
        case "ArrowRight": case "ArrowDown": angle = world.targetAngle + Math.PI / 12; break;
        case "ArrowLeft": case "ArrowUp": angle = world.targetAngle - Math.PI / 12; break;
        case "Home": angle = Math.PI / 2; break;
        case "End": angle = Math.PI * 1.5; break;
        case "Enter": case " ": angle = world.targetAngle; break;
        default: return;
      }
      event.preventDefault();
      setField(angle, 1);
    });

    function bound(item, x, y) {
      const c = Math.abs(Math.cos(item.angle)), s = Math.abs(Math.sin(item.angle));
      const rx = Math.min(wall.w * .30, (c * item.w + s * item.h) * .46 + 3);
      const ry = Math.min(wall.h * .30, (c * item.h + s * item.w) * .46 + 3);
      return [clamp(x, rx, wall.w - rx), clamp(y, ry, wall.h - ry)];
    }

    function localPoint(event) {
      const box = gallery.getBoundingClientRect();
      return { x: event.clientX - box.left, y: event.clientY - box.top, clock: performance.now() };
    }

    function beginGrip(event, item) {
      if (!event.isPrimary || event.button !== 0 || grip) return;
      endRewind(false);
      select(item.index);
      const point = localPoint(event);
      grip = {
        pointer: event.pointerId, item, point, offsetX: item.x - point.x, offsetY: item.y - point.y,
        track: [point], moving: false, shear: 0
      };
      item.button.setPointerCapture(event.pointerId);
      item.button.focus({ preventScroll: true });
      askFrame();
    }

    function moveGrip(event) {
      if (!grip || grip.pointer !== event.pointerId) return;
      const point = localPoint(event);
      if (!grip.moving) {
        if (Math.hypot(point.x - grip.point.x, point.y - grip.point.y) < 3) return;
        record();
        rehang = null;
        grip.moving = true;
        grip.item.anchored = false;
        grip.item.button.classList.add("is-held");
        if (!reduced.matches) grip.item.button.style.zIndex = "5";
      }
      const item = grip.item;
      const before = grip.track[grip.track.length - 1];
      const sx = point.x - before.x, sy = point.y - before.y;
      const elapsed = Math.max(8, point.clock - before.clock) / 1000;
      const [x, y] = bound(item, point.x + grip.offsetX, point.y + grip.offsetY);
      item.vx = clamp((x - item.x) / elapsed, -1900, 1900);
      item.vy = clamp((y - item.y) / elapsed, -1900, 1900);
      if (!reduced.matches) {
        const twist = clamp((sx * grip.offsetY - sy * grip.offsetX) / (item.radius * item.radius) * -.4, -.10, .10);
        item.angle += twist;
        grip.shear = lerp(grip.shear, twist / elapsed, .31);
      }
      item.x = x;
      item.y = y;
      grip.track.push(point);
      grip.track = grip.track.filter(previous => point.clock - previous.clock <= 105);
      askFrame();
    }

    function endGrip(event, launch = true) {
      if (!grip || (event && grip.pointer !== event.pointerId)) return;
      const held = grip;
      grip = null;
      const item = held.item;
      item.button.classList.remove("is-held");
      item.button.style.zIndex = "";
      if (!held.moving) return;
      const point = event ? localPoint(event) : held.track[held.track.length - 1];
      const last = held.track[held.track.length - 1];
      const previous = held.track.find(p => point.clock - p.clock < 102);
      if (launch && previous && point.clock - last.clock < 76) {
        const dt = Math.max(.018, (point.clock - previous.clock) / 1000);
        let u = (point.x - previous.x) / dt, v = (point.y - previous.y) / dt;
        const speed = Math.hypot(u, v);
        const limiter = Math.min(1.14, 1650 * wall.unit / Math.max(1, speed));
        item.vx = u * limiter;
        item.vy = v * limiter;
        item.spin = clamp(held.shear + (u * held.offsetY - v * held.offsetX) / (item.radius * item.radius) * -.18, -6.6, 6.6);
      } else {
        item.vx = item.vy = item.spin = 0;
      }
      if (world.recording && world.t - world.lastSaved > RECORD_STEP * .55) snapshot();
      askFrame();
    }

    for (const item of objects) {
      const button = item.button;
      button.addEventListener("pointerdown", event => beginGrip(event, item));
      button.addEventListener("pointermove", moveGrip);
      button.addEventListener("pointerup", event => endGrip(event));
      button.addEventListener("pointercancel", event => endGrip(event, false));
      button.addEventListener("lostpointercapture", event => endGrip(event, false));
      button.addEventListener("click", () => select(item.index));
      button.addEventListener("keydown", event => {
        const impulse = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[event.key];
        if (!impulse) return;
        event.preventDefault();
        endRewind(false);
        rehang = null;
        select(item.index);
        record();
        item.anchored = false;
        item.vx += impulse[0] * 285 * wall.unit;
        item.vy += impulse[1] * 285 * wall.unit;
        item.spin = clamp(item.spin + (impulse[0] || -impulse[1]) * 1.18, -5, 5);
        askFrame();
      });
    }

    function impact(item, x, y, speed) {
      if (speed < 116 * wall.unit || world.clock - item.lastSound < .105) return;
      item.lastSound = world.clock;
      if (!reduced.matches) {
        flecks.push({ x, y, age: 0, opacity: clamp(speed / 700, .19, .56) });
        if (flecks.length > 18) flecks.shift();
      }
      if (!audio || !soundEnabled || audio.state !== "running") return;
      const now = audio.currentTime;
      const intensity = clamp(speed / 1350, .035, .48);
      for (const ratio of [1, 2.78]) {
        const oscillator = audio.createOscillator(), level = audio.createGain();
        oscillator.type = ratio === 1 ? "sine" : "triangle";
        oscillator.frequency.setValueAtTime(item.pitch * ratio, now);
        oscillator.frequency.exponentialRampToValueAtTime(item.pitch * ratio * .83, now + .043);
        level.gain.setValueAtTime(.0001, now);
        level.gain.exponentialRampToValueAtTime(intensity * (ratio === 1 ? .35 : .065), now + .004);
        level.gain.exponentialRampToValueAtTime(.0001, now + .17);
        oscillator.connect(level).connect(audio.destination);
        oscillator.start();
        oscillator.stop(now + .18);
      }
    }

    function hitWalls(item) {
      const [x, y] = bound(item, item.x, item.y);
      if (x !== item.x) {
        const old = item.vx;
        const leaving = old * (item.x - x) > 0;
        item.x = x;
        if (leaving) {
          item.vx = Math.abs(old) < 45 * wall.unit ? 0 : old * -.58;
          item.vy *= .95;
          item.spin = item.spin * .63 + clamp(item.vy * .006, -2.4, 2.4) * Math.sign(old);
          impact(item, x > wall.w / 2 ? wall.w - 8 : 8, y, Math.abs(old));
        }
      }
      if (y !== item.y) {
        const old = item.vy;
        const leaving = old * (item.y - y) > 0;
        item.y = y;
        if (leaving) {
          item.vy = Math.abs(old) < 45 * wall.unit ? 0 : old * -.57;
          item.vx *= .94;
          item.spin = item.spin * .61 + clamp(item.vx * .006, -2.5, 2.5) * -Math.sign(old);
          impact(item, x, y > wall.h / 2 ? wall.h - 8 : 8, Math.abs(old));
        }
      }
    }

    function held(item) { return grip?.moving && grip.item === item; }

    function contacts() {
      for (let i = 0; i < objects.length - 1; i++) {
        for (let j = i + 1; j < objects.length; j++) {
          const a = objects[i], b = objects[j];
          if (a.anchored && b.anchored) continue;
          const dx = b.x - a.x, dy = b.y - a.y;
          const dist = Math.hypot(dx, dy);
          const overlap = a.radius + b.radius - dist;
          if (overlap <= 0) continue;
          const nx = dist < .01 ? 1 : dx / dist, ny = dist < .01 ? 0 : dy / dist;
          const va = held(a) ? 0 : 1 / a.mass, vb = held(b) ? 0 : 1 / b.mass;
          const inverseMass = va + vb;
          if (!inverseMass) continue;
          a.anchored = b.anchored = false;
          const push = Math.max(0, overlap - .5) * .78 / inverseMass;
          a.x -= nx * push * va; a.y -= ny * push * va;
          b.x += nx * push * vb; b.y += ny * push * vb;
          const relative = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
          if (relative > -2) continue;
          const speed = -relative * 1.62 / inverseMass;
          const tangential = (b.vx - a.vx) * -ny + (b.vy - a.vy) * nx;
          a.vx -= speed * nx * va; a.vy -= speed * ny * va;
          b.vx += speed * nx * vb; b.vy += speed * ny * vb;
          a.spin = clamp(a.spin - .0044 * tangential * va, -7, 7);
          b.spin = clamp(b.spin + .0044 * tangential * vb, -7, 7);
          impact(b.mass < a.mass ? b : a, a.x + nx * a.radius, a.y + ny * a.radius, -relative);
        }
      }
    }

    function simulate(dt) {
      world.t += dt;
      const ease = 1 - Math.exp(-dt * 11.5);
      world.angle = normalized(world.angle + shortest(world.angle, world.targetAngle) * ease);
      world.force = lerp(world.force, world.targetForce, ease);
      if (Math.abs(world.force - world.targetForce) < .001) world.force = world.targetForce;
      const g = 790 * wall.unit * world.force;
      const gx = g * Math.cos(world.angle), gy = g * Math.sin(world.angle);
      for (const item of objects) {
        if (held(item)) continue;
        if (item.anchored) {
          const phase = world.t * (1.29 - item.index * .071) + item.index * 1.39;
          const drift = reduced.matches ? 0 : wall.unit;
          item.x = item.homeX + Math.sin(phase * .67) * 5.5 * drift;
          item.y = item.homeY + Math.sin(phase) * 12 * drift;
          item.angle = item.tilt + Math.cos(phase * .72) * .050 * drift;
          continue;
        }
        const air = Math.pow(world.force > .02 ? .983 : .9905, dt * 60);
        item.vx = (item.vx + gx * dt) * air;
        item.vy = (item.vy + gy * dt) * air;
        item.spin *= Math.pow(.976, dt * 60);
        if (Math.abs(item.spin) < .006) item.spin = 0;
        item.x += item.vx * dt;
        item.y += item.vy * dt;
        item.angle += item.spin * dt;
        hitWalls(item);
      }
      contacts();
      for (const item of objects) {
        if (!item.anchored && !held(item)) hitWalls(item);
      }
      const active = grip?.moving || turn !== null || Math.abs(world.force - world.targetForce) > .02 ||
        Math.abs(shortest(world.angle, world.targetAngle)) > .02 ||
        objects.some(item => !item.anchored && (Math.hypot(item.vx, item.vy) > 27 * wall.unit || Math.abs(item.spin) > .094));
      world.noMotion = active ? 0 : world.noMotion + dt;
      if (world.recording) {
        if (world.noMotion > .72 && world.clock - recordingSince > .8) world.recording = false;
        else if (world.t - world.lastSaved >= RECORD_STEP - .001) snapshot();
      }
    }

    function beginRewind(source) {
      if (rewind) return;
      endGrip(null, false);
      rehang = null;
      if (past.length < 2) {
        notice("先移动一件藏品，时间轴就会开始记录。");
        return;
      }
      world.recording = false;
      rewind = { source, real: performance.now(), offset: 0, frames: 0 };
      echoes = [];
      flecks = [];
      gallery.classList.add("is-rewinding");
      rewindButton.dataset.holding = "true";
      rewindButton.setAttribute("aria-pressed", "true");
      announceField();
      askFrame();
    }

    function rewindOne() {
      if (past.length < 2) return;
      const sample = past.pop();
      if (!reduced.matches) {
        echoes.push(...sample.pieces.map(([x, y], index) => ({x: x * wall.w, y: y * wall.h, age: 0, index })));
        if (echoes.length > 100) echoes.splice(0, echoes.length - 100);
      }
      restore(past[past.length - 1]);
      showMemory();
    }

    function endRewind(quick) {
      if (!rewind) return;
      const duration = performance.now() - rewind.real;
      if (quick && duration < 155) {
        const left = Math.max(0, 12 - rewind.frames);
        for (let i = 0; i < left; i++) rewindOne();
      }
      rewind = null;
      world.sum = 0;
      gallery.classList.remove("is-rewinding");
      rewindButton.dataset.holding = "false";
      rewindButton.setAttribute("aria-pressed", "false");
      announceField();
      if (quick) record();
      askFrame();
    }

    rewindButton.addEventListener("pointerdown", event => {
      if (!event.isPrimary || event.button !== 0) return;
      rewindButton.setPointerCapture(event.pointerId);
      beginRewind(event.pointerId);
    });
    function releaseRewind(event) { if (rewind?.source === event.pointerId) endRewind(event.type === "pointerup"); }
    rewindButton.addEventListener("pointerup", releaseRewind);
    rewindButton.addEventListener("pointercancel", releaseRewind);
    rewindButton.addEventListener("lostpointercapture", releaseRewind);
    rewindButton.addEventListener("keydown", event => {
      if (event.key !== " " && event.key !== "Enter") return;
      event.preventDefault();
      if (!event.repeat) beginRewind("button-key");
    });
    rewindButton.addEventListener("keyup", event => {
      if (event.key !== " " && event.key !== "Enter") return;
      event.preventDefault();
      if (rewind?.source === "button-key") endRewind(true);
    });
    rewindButton.addEventListener("blur", () => { if (rewind?.source === "button-key") endRewind(false); });
    rewindButton.addEventListener("click", event => {
      if (event.detail !== 0) return;
      beginRewind("click");
      endRewind(true);
    });
    document.addEventListener("keydown", event => {
      if (help.open || event.altKey || event.metaKey || event.ctrlKey || event.code !== "KeyR") return;
      event.preventDefault();
      if (!event.repeat) beginRewind("r-key");
    });
    document.addEventListener("keyup", event => {
      if (event.code === "KeyR" && rewind?.source === "r-key") endRewind(true);
    });
    addEventListener("blur", () => { endRewind(false); endGrip(null, false); });

    function arrange() {
      endRewind(false);
      endGrip(null, false);
      rehang = reduced.matches ? null : { t: 0, from: objects.map(item => [item.x, item.y, item.angle]) };
      past = [];
      echoes = [];
      flecks = [];
      world.recording = false;
      world.t = world.sum = 0;
      world.angle = world.targetAngle = Math.PI / 2;
      world.force = world.targetForce = 0;
      for (const item of objects) {
        item.anchored = true;
        item.vx = item.vy = item.spin = 0;
        if (!rehang) {
          item.x = item.homeX; item.y = item.homeY; item.angle = item.tilt;
        }
      }
      select(0);
      showMemory();
      announceField();
      askFrame();
    }
    $("#reset").addEventListener("click", arrange);

    function layout() {
      const w = Math.round(gallery.clientWidth), h = Math.round(gallery.clientHeight);
      if (!w || !h || (w === wall.w && h === wall.h)) return;
      const before = {...wall};
      wall.w = w; wall.h = h;
      wall.narrow = w <= 700;
      wall.unit = clamp(Math.min(w, h) / 690, .63, 1.55);
      wall.ratio = Math.min(devicePixelRatio || 1, 1.7, 2160 / w);
      canvas.width = Math.round(w * wall.ratio);
      canvas.height = Math.round(h * wall.ratio);
      ctx?.setTransform(wall.ratio, 0, 0, wall.ratio, 0, 0);
      rehang = null;
      endGrip(null, false);
      for (const item of objects) {
        const meta = metadata[item.index];
        const [centerX, centerY] = wall.narrow ? meta.mobile : [meta.x, meta.y];
        item.homeX = w * centerX;
        item.homeY = h * centerY;
        const width = wall.narrow ? Math.min(w * meta.phone, h * .287) : Math.min(w * meta.scale, h * (item.index === 1 ? .405 : .372));
        const aspect = Number(item.image.getAttribute("width")) / Number(item.image.getAttribute("height"));
        item.w = width;
        item.h = width / (aspect || 1);
        if (item.h > h * .37) { item.h = h * .37; item.w = item.h * (aspect || 1); }
        item.radius = (item.w + item.h) * .223;
        item.button.style.width = item.w + "px";
        item.button.style.height = item.h + "px";
        if (item.anchored || !before.w) {
          item.x = item.homeX; item.y = item.homeY; item.angle = item.tilt;
        } else {
          const [x, y] = bound(item, item.x * wall.w / before.w, item.y * wall.h / before.h);
          item.x = x; item.y = y;
          item.vx *= wall.unit / before.unit;
          item.vy *= wall.unit / before.unit;
        }
      }
      render();
      askFrame();
    }

    function drawShadow(paint, item, dims, angle, force) {
      const { w, h } = dims;
      const normal = Math.abs(force) * .82;
      const fx = Math.cos(angle) * normal;
      const fy = lerp(1, Math.sin(angle), normal);
      const downX = clamp(item.x + (item.x - w * .48) * .060 + 13, 0, w);
      const downY = h * .79 + .158 * h * (item.y / h);
      const pinX = clamp(item.x + fx * (w / 3.2), 10, w - 10);
      const pinY = clamp(item.y + fy * (h / 2.55), 12, h - 12);
      const centerX = lerp(downX, pinX, normal);
      const centerY = lerp(downY, pinY, normal);
      const size = item.w * (.28 + (1 - item.y / h) * .19);
      paint.save();
      paint.translate(centerX, centerY);
      paint.rotate(fx * -.84);
      paint.scale(1, .184 + .067 * normal);
      const grad = paint.createRadialGradient(0, 0, size * .10, 0, 0, size);
      grad.addColorStop(0, "rgba(34,4,2,.46)");
      grad.addColorStop(.35, "rgba(43,4,3,.26)");
      grad.addColorStop(1, "rgba(44,6,1,0)");
      paint.fillStyle = grad;
